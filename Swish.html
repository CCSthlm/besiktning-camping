<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obemannad Swish – CCSthlm</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--bg2:#fff;--bg3:#eeede8;--bg4:#e5e4de;
  --text:#1a1a18;--text2:#5a5a57;--text3:#909088;
  --accent:#3B6D11;--accent2:#27500A;--accent-glow:rgba(59,109,17,.1);
  --blue:#1a4f7a;--blue-bg:rgba(26,79,122,.08);
  --red:#A32D2D;--red-bg:#FCEBEB;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --green-bg:#EAF3DE;--green-text:#27500A;
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
  --radius:10px;--radius-lg:16px;--shadow:0 2px 16px rgba(0,0,0,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;}

/* TOPBAR */
#topbar{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 16px;height:46px;}
.tb-logo{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--text);}
.tb-logo i{color:var(--accent);}
.tb-sep{width:1px;height:22px;background:var(--border2);margin:0 12px;flex-shrink:0;}
.tb-user{font-size:12px;color:var(--text2);margin-right:auto;}
.tb-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;margin-left:6px;text-decoration:none;white-space:nowrap;}
.tb-btn:hover{background:var(--bg3);}
.tb-btn-danger{background:var(--red-bg);color:var(--red);border-color:rgba(163,45,45,.25);}
.tb-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:8px;}

/* TABS */
.tab-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border2);padding:0 16px;}
.tab-btn{padding:12px 16px;font-size:13px;font-weight:500;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .15s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* PAGE */
.page{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
.page.wide{max-width:960px;}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
.card-body{padding:18px;}

/* FORM */
.form-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-field label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;}
.form-field input,.form-field select,.form-field textarea{padding:11px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);font-size:15px;color:var(--text);font-family:inherit;transition:border-color .2s;-webkit-appearance:none;}
.form-field input:focus,.form-field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.form-field input[type=number]{text-align:right;}
.req{color:var(--red);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* SWISH CARD */
.swish-amount{font-size:32px;font-weight:700;color:var(--accent);text-align:center;padding:20px 0 4px;}
.swish-label{font-size:12px;color:var(--text3);text-align:center;margin-bottom:16px;text-transform:uppercase;letter-spacing:.05em;}

/* POSTER */
.post-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg2);}
.post-row:last-child{border-bottom:none;}
.post-name{flex:1;font-size:14px;font-weight:500;}
.post-konto{font-size:11px;color:var(--text3);}
.post-input{width:90px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-size:14px;text-align:right;font-family:inherit;background:var(--bg3);color:var(--text);}
.post-input:focus{outline:none;border-color:var(--accent);}
.post-antal{width:70px;}

/* DIFFERENS */
.diff-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:2px solid var(--border2);background:var(--bg3);border-radius:0 0 var(--radius-lg) var(--radius-lg);}
.diff-label{font-size:13px;font-weight:500;color:var(--text2);}
.diff-val{font-size:16px;font-weight:700;}
.diff-ok{color:var(--accent);}
.diff-err{color:var(--red);}
.diff-badge{font-size:11px;padding:2px 9px;border-radius:20px;margin-left:8px;}
.diff-badge-ok{background:var(--green-bg);color:var(--green-text);}
.diff-badge-err{background:var(--red-bg);color:var(--red);}

/* BUTTONS */
.btn{padding:10px 18px;background:var(--bg3);color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.btn:hover{background:var(--bg4);}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent;font-size:15px;padding:14px 24px;width:100%;justify-content:center;border-radius:var(--radius-lg);}
.btn-primary:hover{background:var(--accent2);}
.btn-primary:disabled{background:var(--bg4);color:var(--text3);cursor:not-allowed;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:rgba(163,45,45,.2);}
.btn-blue{background:var(--blue-bg);color:var(--blue);border-color:rgba(26,79,122,.2);}

/* HISTORIK */
.hist-item{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .12s;}
.hist-item:hover{background:var(--bg3);}
.hist-item:last-child{border-bottom:none;}
.hist-icon{width:40px;height:40px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hist-info{flex:1;min-width:0;}
.hist-title{font-size:13px;font-weight:600;}
.hist-meta{font-size:12px;color:var(--text3);margin-top:2px;}
.hist-amount{font-size:15px;font-weight:700;color:var(--accent);}

/* ADMIN TABLE */
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:9px 14px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border2);background:var(--bg3);}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(59,109,17,.025);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:480px;box-shadow:0 8px 40px rgba(0,0,0,.18);margin:auto;}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;}
.modal-body{padding:18px 20px;}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-green{background:var(--green-bg);color:var(--green-text);}
.badge-red{background:var(--red-bg);color:var(--red);}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;border-radius:var(--radius-lg);padding:12px 20px;font-size:13px;z-index:999;opacity:0;transition:all .25s;pointer-events:none;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:var(--shadow);}

/* DETAIL VIEW */
.detail-section{margin-bottom:16px;}
.detail-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.detail-row:last-child{border-bottom:none;}
.detail-name{font-size:13px;color:var(--text2);}
.detail-val{font-size:13px;font-weight:500;}

/* SUCCESS SCREEN */
.success-screen{text-align:center;padding:40px 20px;}
.success-icon{font-size:56px;color:var(--accent);display:block;margin-bottom:16px;}
.success-title{font-size:22px;font-weight:700;margin-bottom:8px;}
.success-sub{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.6;}
.success-nr{font-size:28px;font-weight:700;color:var(--accent);background:var(--green-bg);border-radius:var(--radius-lg);padding:12px 24px;display:inline-block;margin-bottom:24px;}

@media(max-width:480px){
  .form-row{grid-template-columns:1fr;}
  .post-input{width:80px;}
  .post-antal{width:60px;}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="tb-logo"><i class="ti ti-brand-cashapp"></i> Obemannad Swish</div>
  <div class="tb-sep"></div>
  <div class="tb-avatar" id="tb-avatar">?</div>
  <div class="tb-user" id="tb-user">–</div>
  <a href="index.html" class="tb-btn"><i class="ti ti-arrow-left"></i><span class="desktop-only"> Portal</span></a>
  <button class="tb-btn tb-btn-danger" onclick="portalLogout()"><i class="ti ti-logout"></i> Logga ut</button>
</div>

<div class="tab-bar" id="tab-bar">
  <button class="tab-btn active" id="tab-ny" onclick="showTab('ny')"><i class="ti ti-plus"></i> Ny registrering</button>
  <button class="tab-btn" id="tab-historik" onclick="showTab('historik')"><i class="ti ti-history"></i> Historik</button>
  <button class="tab-btn" id="tab-admin" onclick="showTab('admin')" style="display:none"><i class="ti ti-settings"></i> Administration</button>
</div>

<!-- NY REGISTRERING -->
<div id="view-ny">
  <div class="page" id="form-page">
    <!-- dynamically rendered -->
  </div>
  <div id="success-page" style="display:none">
    <div class="page">
      <div class="success-screen">
        <i class="ti ti-circle-check success-icon"></i>
        <div class="success-title">Kassarapport inskickad!</div>
        <div class="success-sub" id="success-info">–</div>
        <div class="success-nr" id="success-nr">–</div>
        <button class="btn-primary btn" onclick="resetForm()" style="max-width:320px;margin:0 auto"><i class="ti ti-plus"></i> Ny registrering</button>
      </div>
    </div>
  </div>
</div>

<!-- HISTORIK -->
<div id="view-historik" style="display:none">
  <div class="page wide">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px">
      <div>
        <h2 style="font-size:18px;font-weight:700">Historik</h2>
        <div style="font-size:13px;color:var(--text2);margin-top:2px">Tidigare kassarapporter</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="hist-camping-filter" onchange="renderHistorik()" style="padding:8px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--bg2)">
          <option value="">Alla campingar</option>
        </select>
        <button class="btn btn-blue" onclick="exportExcel()"><i class="ti ti-download"></i> Excel</button>
        <button class="btn btn-blue" onclick="exportBL()"><i class="ti ti-file-spreadsheet"></i> BL-export</button>
      </div>
    </div>
    <div class="card">
      <div id="historik-list"></div>
    </div>
  </div>
</div>

<!-- ADMIN -->
<div id="view-admin" style="display:none">
  <div class="page wide">
    <div style="margin-bottom:16px">
      <h2 style="font-size:18px;font-weight:700">Administration</h2>
      <div style="font-size:13px;color:var(--text2);margin-top:2px">Konfigurera formuläret och kontoinställningar</div>
    </div>

    <!-- Globala inställningar -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><span class="card-title"><i class="ti ti-settings"></i> Globala inställningar</span>
        <button class="btn btn-sm" onclick="saveConfig()"><i class="ti ti-device-floppy"></i> Spara</button>
      </div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-field">
            <label>Swish-konto (debet)</label>
            <input type="text" id="cfg-swish-konto" placeholder="1582">
          </div>
          <div class="form-field">
            <label>Prefix kassarapport-nr</label>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">Sätts per camping: Ostnora1, Bjorko1…</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Poster -->
    <div class="card">
      <div class="card-header">
        <span class="card-title"><i class="ti ti-list"></i> Formulärposter</span>
        <button class="btn btn-primary btn-sm" onclick="openPostModal(null)"><i class="ti ti-plus"></i> Ny post</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Ordning</th><th>Namn</th><th>Konto</th><th>Momssats</th>
            <th>Har antal</th><th>Aktiv</th><th style="text-align:right">Åtgärder</th>
          </tr></thead>
          <tbody id="admin-poster-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: DETALJ -->
<div class="modal-overlay" id="modal-detalj">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-detalj-title">Kassarapport</span>
      <button class="modal-close" onclick="closeModal('modal-detalj')">&#x2715;</button>
    </div>
    <div class="modal-body" id="modal-detalj-body"></div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="btn-radera" onclick="raderaReg()"><i class="ti ti-trash"></i> Radera</button>
      <button class="btn" onclick="closeModal('modal-detalj')">Stäng</button>
    </div>
  </div>
</div>

<!-- MODAL: POST -->
<div class="modal-overlay" id="modal-post">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-post-title">Ny post</span>
      <button class="modal-close" onclick="closeModal('modal-post')">&#x2715;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="post-edit-id">
      <div class="form-field"><label>Namn <span class="req">*</span></label><input type="text" id="post-namn" placeholder="Bastu"></div>
      <div class="form-row">
        <div class="form-field"><label>Konto <span class="req">*</span></label><input type="text" id="post-konto" placeholder="3034"></div>
        <div class="form-field"><label>Momssats</label>
          <select id="post-moms">
            <option value="0">0%</option>
            <option value="6">6%</option>
            <option value="12">12%</option>
            <option value="25">25%</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Har antal?</label>
          <select id="post-antal"><option value="true">Ja</option><option value="false">Nej</option></select>
        </div>
        <div class="form-field"><label>Aktiv</label>
          <select id="post-aktiv"><option value="true">Ja</option><option value="false">Nej</option></select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-post')">Avbryt</button>
      <button class="btn btn-primary btn-sm" onclick="savePost()"><i class="ti ti-check"></i> Spara</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var GH_REPO      = 'CCSthlm/besiktning-camping';
var SWISH_BASE   = 'swish';
var CONFIG_PATH  = SWISH_BASE+'/settings/config.json';

var _user    = null;
var _isAdmin = false;
var _config  = {swishKonto:'1582', poster:[]};
var _regs    = []; // loaded registrations
var _campingar = [];
var _raderaId = null;
var _currentFormCamping = '';

// Default poster
var DEFAULT_POSTER = [
  {id:'p1', namn:'Bastu',         konto:'3034', moms:25, harAntal:true,  aktiv:true, ordning:1},
  {id:'p2', namn:'Tvätt',         konto:'3044', moms:25, harAntal:true,  aktiv:true, ordning:2},
  {id:'p3', namn:'Släputhyrning', konto:'3430', moms:25, harAntal:true,  aktiv:true, ordning:3},
  {id:'p4', namn:'Gasoltester',   konto:'3030', moms:25, harAntal:true,  aktiv:true, ordning:4},
  {id:'p5', namn:'CamperClean',   konto:'3030', moms:25, harAntal:true,  aktiv:true, ordning:5},
  {id:'p6', namn:'Lotterier',     konto:'3402', moms:0,  harAntal:false, aktiv:true, ordning:6},
];

// ── INIT ──────────────────────────────────────────────────────────────────
async function init() {
  var sess = sessionStorage.getItem('ccs_session') || sessionStorage.getItem('ccs_portal_user');
  if (sess) { try { _user = JSON.parse(sess); } catch(e) {} }
  if (!_user) _user = {name:'Testanvändare', adminRoles:[], id:'local'};

  var roles = _user.adminRoles || [];
  _isAdmin  = roles.includes('swish-admin') || roles.includes('global');

  var initials = (_user.name||'?').split(' ').map(function(n){return n[0]||'';}).join('').slice(0,2).toUpperCase();
  document.getElementById('tb-avatar').textContent = initials;
  document.getElementById('tb-user').textContent   = _user.name;
  if (_isAdmin) document.getElementById('tab-admin').style.display='';

  await loadConfig();
  await loadCampingar();
  populateFilters();
  renderForm();
  showTab('ny');
}

// ── GITHUB ────────────────────────────────────────────────────────────────
async function ghGet(path) {
  var token = localStorage.getItem('gh_token')||'';
  if (!token) return null;
  try {
    var r = await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,
      {headers:{'Authorization':'token '+token}});
    if (!r.ok) return null;
    var g = await r.json();
    var b = Uint8Array.from(atob(g.content.split('\n').join('')), function(c){return c.charCodeAt(0);});
    return {data:JSON.parse(new TextDecoder('utf-8').decode(b)), sha:g.sha};
  } catch(e) { return null; }
}

async function ghPut(path, data, msg) {
  var token = localStorage.getItem('gh_token')||'';
  if (!token) { toast('Token saknas','err'); return false; }
  var chk = await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,
    {headers:{'Authorization':'token '+token}});
  var sha = chk.ok ? (await chk.json()).sha : null;
  var content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  var payload = {message:msg||'Swish update', content, branch:'main'};
  if (sha) payload.sha = sha;
  var r = await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,
    {method:'PUT', headers:{'Authorization':'token '+token,'Content-Type':'application/json'},
     body:JSON.stringify(payload)});
  return r.ok;
}

async function ghList(path) {
  var token = localStorage.getItem('gh_token')||'';
  if (!token) return [];
  try {
    var r = await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,
      {headers:{'Authorization':'token '+token}});
    if (!r.ok) return [];
    return await r.json();
  } catch(e) { return []; }
}

// ── CONFIG ────────────────────────────────────────────────────────────────
async function loadConfig() {
  var r = await ghGet(CONFIG_PATH);
  if (r && r.data) {
    _config = Object.assign({swishKonto:'1582', poster:[]}, r.data);
    if (!_config.poster.length) _config.poster = DEFAULT_POSTER;
  } else {
    _config = {swishKonto:'1582', poster:DEFAULT_POSTER};
  }
  if (document.getElementById('cfg-swish-konto'))
    document.getElementById('cfg-swish-konto').value = _config.swishKonto||'1582';
}

async function saveConfig() {
  _config.swishKonto = document.getElementById('cfg-swish-konto').value.trim() || '1582';
  var ok = await ghPut(CONFIG_PATH, _config, 'Swish config uppdaterad');
  if (ok) toast('Inställningar sparade','ok');
  else    toast('Kunde ej spara','err');
}

// ── CAMPINGAR ─────────────────────────────────────────────────────────────
async function loadCampingar() {
  var r = await ghGet('users/users.json');
  if (r && r.data && r.data.campings) {
    _campingar = r.data.campings.filter(function(c){return c.active!==false;})
      .map(function(c){return {id:c.id||c.name, name:c.name};});
  }
  if (!_campingar.length) {
    _campingar = [
      {id:'ostnora',    name:'Östnora'},
      {id:'orstig',     name:'Örstig'},
      {id:'mista',      name:'Mista'},
      {id:'storsved',   name:'Storsved'},
      {id:'kapellskar', name:'Kapellskär'},
      {id:'bo_camp',    name:'Björkö Örns Camping'},
      {id:'graddos',    name:'Gräddös Pärla'},
      {id:'angsudden',  name:'Ängsudden'},
    ];
  }
}

function campingPrefix(campingId) {
  var map = {
    ostnora:'Ostnora', orstig:'Orstig', mista:'Mista', storsved:'Storsved',
    kapellskar:'Kapellskar', bo_camp:'Bjorko', graddos:'Graddos',
    angsudden:'Angsudden', sektionsgem:'Sektion',
  };
  return map[campingId] || campingId;
}

function populateFilters() {
  var sel = document.getElementById('hist-camping-filter');
  if (!sel) return;
  while (sel.options.length > 1) sel.remove(1);
  _campingar.forEach(function(c) {
    var o = document.createElement('option'); o.value=c.id; o.textContent=c.name; sel.appendChild(o);
  });
}

// ── KASSARAPPORT NR ───────────────────────────────────────────────────────
async function nextRapportNr(campingId) {
  var prefix = campingPrefix(campingId);
  var files  = await ghList(SWISH_BASE+'/registreringar');
  if (!Array.isArray(files)) files = [];
  var max = 0;
  files.forEach(function(f) {
    if (f.name && f.name.startsWith(prefix)) {
      var m = f.name.match(/(\d+)\.json$/);
      if (m) max = Math.max(max, parseInt(m[1]));
    }
  });
  return prefix+(max+1);
}

function onCampingChange() {
  var campingId = document.getElementById('f-camping').value;
  _currentFormCamping = campingId;
  document.getElementById('f-nr').value = 'Laddar…';
  if (campingId) {
    nextRapportNr(campingId).then(function(nr){
      document.getElementById('f-nr').value = nr;
    });
  } else {
    document.getElementById('f-nr').value = '';
  }
  updateDiff();
}

function getFormData() {
  var aktivaPoster = _config.poster.filter(function(p){return p.aktiv!==false;});
  var poster = {};
  aktivaPoster.forEach(function(p) {
    var bEl = document.querySelector('[data-pid="'+p.id+'"][data-field="belopp"]');
    var aEl = document.querySelector('[data-pid="'+p.id+'"][data-field="antal"]');
    poster[p.id] = {
      belopp: parseFloat((bEl&&bEl.value)||0)||0,
      antal:  p.harAntal ? (parseFloat((aEl&&aEl.value)||0)||0) : null,
    };
  });
  return poster;
}

function updateDiff() {
  var swish   = parseFloat(document.getElementById('f-swish')&&document.getElementById('f-swish').value||0)||0;
  var camping = document.getElementById('f-camping')&&document.getElementById('f-camping').value;
  var poster  = getFormData();
  var sumPost = 0;
  Object.values(poster).forEach(function(p){ sumPost += p.belopp||0; });
  var diff    = swish - sumPost;
  var diffEl  = document.getElementById('diff-val');
  var badgeEl = document.getElementById('diff-badge');
  var btnEl   = document.getElementById('btn-skicka');
  if (diffEl) {
    diffEl.textContent = (diff===0&&swish>0) ? '0 kr' : (diff>0?'+':'')+Math.round(diff)+' kr';
    diffEl.className   = 'diff-val '+(diff===0&&swish>0?'diff-ok':'diff-err');
  }
  if (badgeEl) {
    badgeEl.innerHTML  = diff===0&&swish>0
      ? '<span class="diff-badge diff-badge-ok"><i class="ti ti-check" style="font-size:10px"></i> Balanserad</span>'
      : '<span class="diff-badge diff-badge-err"><i class="ti ti-x" style="font-size:10px"></i> Stämmer ej</span>';
  }
  if (btnEl) btnEl.disabled = !(diff===0 && swish>0 && camping);
}

async function skickaIn() {
  var camping = document.getElementById('f-camping').value;
  var datum   = document.getElementById('f-datum').value;
  var nr      = document.getElementById('f-nr').value;
  var swish   = parseFloat(document.getElementById('f-swish').value)||0;
  if (!camping||!datum||!nr||!swish) { toast('Fyll i alla obligatoriska fält','err'); return; }

  var poster = getFormData();
  var reg = {
    id:        uid(),
    nr:        nr,
    campingId: camping,
    campingNamn: (_campingar.find(function(c){return c.id===camping;})||{}).name||camping,
    datum:     datum,
    swishTotal:swish,
    swishKonto:_config.swishKonto||'1582',
    poster:    poster,
    posterConfig: JSON.parse(JSON.stringify(_config.poster.filter(function(p){return p.aktiv!==false;}))),
    inskickatAv: _user.name,
    inskickatTs: new Date().toISOString(),
  };

  var path = SWISH_BASE+'/registreringar/'+nr+'.json';
  var ok   = await ghPut(path, reg, 'Kassarapport '+nr);
  if (!ok) { toast('Kunde ej spara – kontrollera token','err'); return; }

  // Show success
  document.getElementById('form-page').style.display='none';
  document.getElementById('success-page').style.display='';
  document.getElementById('success-nr').textContent = nr;
  document.getElementById('success-info').textContent =
    reg.campingNamn+' · '+datum+' · '+swish.toLocaleString('sv-SE')+' kr';
}

function resetForm() {
  document.getElementById('form-page').style.display='';
  document.getElementById('success-page').style.display='none';
  _currentFormCamping = '';
  renderForm();
}

// ── HISTORIK ──────────────────────────────────────────────────────────────
async function loadHistorik() {
  var files = await ghList(SWISH_BASE+'/registreringar');
  if (!Array.isArray(files)) files=[];
  _regs = [];
  for (var i=0;i<files.length;i++) {
    if (!files[i].name||!files[i].name.endsWith('.json')) continue;
    var r = await ghGet(SWISH_BASE+'/registreringar/'+files[i].name);
    if (r&&r.data&&r.data.nr) _regs.push(r.data);
  }
  _regs.sort(function(a,b){return b.datum.localeCompare(a.datum);});
}

async function renderHistorik() {
  var list = document.getElementById('historik-list');
  list.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text3)"><i class="ti ti-loader" style="font-size:24px;display:block;margin-bottom:8px"></i>Laddar…</div>';
  await loadHistorik();
  var campFil = document.getElementById('hist-camping-filter').value;
  var filtered = campFil ? _regs.filter(function(r){return r.campingId===campFil;}) : _regs;
  if (!filtered.length) {
    list.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)"><i class="ti ti-brand-cashapp" style="font-size:32px;display:block;margin-bottom:10px"></i>Inga kassarapporter</div>';
    return;
  }
  list.innerHTML = filtered.map(function(r) {
    return '<div class="hist-item" data-rid="'+r.id+'" onclick="openDetalj(this.dataset.rid)">'
      +'<div class="hist-icon"><i class="ti ti-brand-cashapp" style="color:var(--accent)"></i></div>'
      +'<div class="hist-info">'
      +'<div class="hist-title">'+r.nr+'</div>'
      +'<div class="hist-meta">'+r.campingNamn+' · '+r.datum+' · '+r.inskickatAv+'</div>'
      +'</div>'
      +'<div class="hist-amount">'+r.swishTotal.toLocaleString('sv-SE')+' kr</div>'
      +'</div>';
  }).join('');
}

      +'<div style="text-align:right">'

    +'<div class="detail-section-title">Information</div>'
    +'<div class="detail-row"><span class="detail-name">Camping</span><span class="detail-val">'+r.campingNamn+'</span></div>'
    +'<div class="detail-row"><span class="detail-name">Datum</span><span class="detail-val">'+r.datum+'</span></div>'
    +'<div class="detail-row"><span class="detail-name">Inskickat av</span><span class="detail-val">'+r.inskickatAv+'</span></div>'
    +'<div class="detail-row"><span class="detail-name">Inskickat</span><span class="detail-val">'+new Date(r.inskickatTs).toLocaleString('sv-SE')+'</span></div>'
    +'</div>'
    +'<div class="detail-section">'
    +'<div class="detail-section-title">Swish-inbetalning</div>'
    +'<div class="detail-row"><span class="detail-name">Konto '+r.swishKonto+'</span>'
    +'<span class="detail-val" style="font-size:18px;color:var(--accent)">'+r.swishTotal.toLocaleString('sv-SE')+' kr</span></div>'
    +'</div>'
    +'<div class="detail-section">'
    +'<div class="detail-section-title">Försäljningsposter</div>'

async function raderaReg() {
  if (!_isAdmin) return;
  var r = _regs.find(function(x){return x.id===_raderaId;});
  if (!confirm('Radera kassarapport '+(r?r.nr:'')+'?')) return;
  // GitHub kan inte ta bort filer via PUT - ersätt med tom markering
  if (r) {
    var path = SWISH_BASE+'/registreringar/'+r.nr+'.json';
    await ghPut(path, Object.assign({},r,{raderad:true, raderadAv:_user.name, raderadTs:new Date().toISOString()}), 'Raderad '+r.nr);
  }
  closeModal('modal-detalj');
  toast('Kassarapport raderad','ok');
  renderHistorik();
}

function openPostModal(pid) {
  var p = pid ? _config.poster.find(function(x){return x.id===pid;}) : null;
  document.getElementById('modal-post-title').textContent = p ? 'Redigera – '+p.namn : 'Ny post';
  document.getElementById('post-edit-id').value   = p ? p.id  : '';
  document.getElementById('post-namn').value      = p ? p.namn  : '';
  document.getElementById('post-konto').value     = p ? p.konto : '';
  document.getElementById('post-moms').value      = p ? String(p.moms||0) : '0';
  document.getElementById('post-antal').value     = p && p.harAntal===false ? 'false' : 'true';
  document.getElementById('post-aktiv').value     = p && p.aktiv===false ? 'false' : 'true';
  openModal('modal-post');
}

async function savePost() {
  var namn  = document.getElementById('post-namn').value.trim();
  var konto = document.getElementById('post-konto').value.trim();
  if (!namn||!konto) { alert('Namn och konto krävs.'); return; }
  var editId = document.getElementById('post-edit-id').value;
  var obj = {
    id:       editId || uid(),
    namn, konto,
    moms:     parseInt(document.getElementById('post-moms').value)||0,
    harAntal: document.getElementById('post-antal').value==='true',
    aktiv:    document.getElementById('post-aktiv').value==='true',
    ordning:  editId ? (_config.poster.find(function(p){return p.id===editId;})||{}).ordning||99 : 99,
  };
  if (editId) {
    var i = _config.poster.findIndex(function(p){return p.id===editId;});
    if (i>=0) _config.poster[i] = obj;
  } else {
    _config.poster.push(obj);
  }
  closeModal('modal-post');
  var ok = await ghPut(CONFIG_PATH, _config, 'Swish post uppdaterad');
  if (ok) toast('Sparad','ok');
  renderAdminPoster();
}

async function deletePost(pid) {
  if (!confirm('Ta bort posten?')) return;
  _config.poster = _config.poster.filter(function(p){return p.id!==pid;});
  var ok = await ghPut(CONFIG_PATH, _config, 'Swish post borttagen');
  if (ok) toast('Borttagen','ok');
  renderAdminPoster();
}

function movePost(idx, dir) {
  var poster = _config.poster.slice().sort(function(a,b){return (a.ordning||0)-(b.ordning||0);});
  var newIdx = idx+dir;
  if (newIdx<0||newIdx>=poster.length) return;
  var tmp = poster[idx].ordning; poster[idx].ordning = poster[newIdx].ordning; poster[newIdx].ordning = tmp;
  _config.poster = poster;
  ghPut(CONFIG_PATH, _config, 'Swish ordning uppdaterad');
  renderAdminPoster();
}

// ── EXCEL / BL ────────────────────────────────────────────────────────────
function exportExcel() {
  if (!window.XLSX) { toast('Excel laddas','warn'); return; }
  var campFil  = document.getElementById('hist-camping-filter').value;
  var filtered = (campFil?_regs.filter(function(r){return r.campingId===campFil;}):_regs)
    .filter(function(r){return !r.raderad;});
  var wb = XLSX.utils.book_new();

  // Sheet 1: Registreringar
  var data1 = [['Nr','Camping','Datum','Swish-konto','Swish-total','Inskickat av']];
  filtered.forEach(function(r) {
    data1.push([r.nr, r.campingNamn, r.datum, r.swishKonto, r.swishTotal, r.inskickatAv]);
    (r.posterConfig||[]).forEach(function(p) {
      var pv = r.poster&&r.poster[p.id];
      if (!pv||(!pv.belopp&&!pv.antal)) return;
      data1.push(['','',p.namn+' ('+p.konto+')', '', pv.belopp||0, pv.antal!=null?pv.antal+'st':'']);
    });
    data1.push([]);
  });
  var ws1 = XLSX.utils.aoa_to_sheet(data1);
  ws1['!cols']=[{wch:16},{wch:24},{wch:12},{wch:8},{wch:14},{wch:20}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Registreringar');

  // Sheet 2: Bokföringsjournal
  var data2 = [['Datum','Kassarapport','Camping','Konto','Kontonamn','Debet','Kredit','Moms%']];
  filtered.forEach(function(r) {
    // Swish debet
    data2.push([r.datum, r.nr, r.campingNamn, r.swishKonto, 'Swish inbetalning', r.swishTotal, '', '']);
    // Poster kredit
    (r.posterConfig||[]).forEach(function(p) {
      var pv = r.poster&&r.poster[p.id];
      if (!pv||!pv.belopp) return;
      data2.push([r.datum, r.nr, r.campingNamn, p.konto, p.namn, '', pv.belopp, p.moms+'%']);
    });
  });
  var ws2 = XLSX.utils.aoa_to_sheet(data2);
  ws2['!cols']=[{wch:12},{wch:16},{wch:20},{wch:8},{wch:22},{wch:12},{wch:12},{wch:8}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Bokföring');

  XLSX.writeFile(wb, 'Swish_kassarapporter_'+todayStr()+'.xlsx');
  toast('Excel exporterad','ok');
}

function exportBL() {
  var campFil  = document.getElementById('hist-camping-filter').value;
  var filtered = (campFil?_regs.filter(function(r){return r.campingId===campFil;}):_regs)
    .filter(function(r){return !r.raderad;});
  var lines = ['Datum;Ver;Text;Konto;Debet;Kredit'];
  filtered.forEach(function(r) {
    var ver = r.nr;
    lines.push([r.datum, ver, 'Swish '+r.campingNamn, r.swishKonto, r.swishTotal.toFixed(2), ''].join(';'));
    (r.posterConfig||[]).forEach(function(p) {
      var pv = r.poster&&r.poster[p.id];
      if (!pv||!pv.belopp) return;
      lines.push([r.datum, ver, p.namn+' '+r.nr, p.konto, '', pv.belopp.toFixed(2)].join(';'));
    });
  });
  var csv  = lines.join('\n');
  var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a'); a.href=url; a.download='Swish_BL_'+todayStr()+'.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('BL-export klar','ok');
}

function showTab(tab) {
  ['ny','historik','admin'].forEach(function(t){
    document.getElementById('view-'+t).style.display = t===tab?'':'none';
    var btn = document.getElementById('tab-'+t);
    if (btn) btn.classList.toggle('active', t===tab);
  });

}

function uid()       { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function openModal(id)  { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.addEventListener('click',function(e){ if(e.target.classList.contains('modal-overlay')) e.target.classList.remove('show'); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show');}); });
function toast(msg, type) {
  var t   = document.getElementById('toast');
  var bg  = type==='err'?'var(--red)':type==='warn'?'var(--amber)':'var(--accent)';
  var ico = type==='err'?'ti-x':type==='warn'?'ti-alert-triangle':'ti-check';
  t.innerHTML = '<i class="ti '+ico+'"></i> '+msg;
  t.style.background = bg;
  t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
  setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(10px)'; },3000);
}
function portalLogout(){
  sessionStorage.setItem('ccs_logged_out','1');
  sessionStorage.removeItem('ccs_session');
  sessionStorage.removeItem('ccs_portal_user');
  window.location.replace('index.html');
}

init();
