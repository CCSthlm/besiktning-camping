<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kontrollprogram – CCSthlm</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--bg2:#fff;--bg3:#eeede8;--bg4:#e5e4de;
  --text:#1a1a18;--text2:#5a5a57;--text3:#909088;
  --green:#3B6D11;--green2:#27500A;--green-bg:#EAF3DE;
  --blue:#1a4f7a;--blue-bg:rgba(26,79,122,.08);
  --red:#A32D2D;--red-bg:#FCEBEB;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --purple:#5b21b6;--purple-bg:rgba(91,33,182,.08);
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg3);color:var(--text);min-height:100vh;overscroll-behavior:none;}

#topbar{position:sticky;top:0;z-index:100;background:var(--bg2);
  border-bottom:1px solid var(--border2);display:flex;align-items:center;
  padding:0 14px;height:48px;gap:8px;}
.tb-logo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;}
.tb-logo i{color:var(--green);font-size:20px;}
.tb-spacer{flex:1;}
.tb-role{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
  background:var(--green-bg);color:var(--green2);}
.tb-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;
  border:1px solid var(--border2);background:none;color:var(--text2);font-size:13px;
  font-weight:500;cursor:pointer;font-family:inherit;text-decoration:none;}
.tb-btn:hover{background:var(--bg3);}
.tb-btn-danger{background:var(--red-bg);color:var(--red);border-color:rgba(163,45,45,.25);}

.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border2);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:13px 14px;font-size:13px;font-weight:500;color:var(--text3);
  border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;
  font-family:inherit;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.tab.active{color:var(--green);border-bottom-color:var(--green);}
.tab-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;
  background:var(--red-bg);color:var(--red);}

.view{display:none;padding:14px 14px 80px;}
.view.active{display:block;}

.card{background:var(--bg2);border-radius:12px;border:1px solid var(--border);
  overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;}

/* STATUS DOTS */
.dot-red{width:9px;height:9px;border-radius:50%;background:var(--red);flex-shrink:0;}
.dot-amber{width:9px;height:9px;border-radius:50%;background:var(--amber);flex-shrink:0;}
.dot-green{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0;}
.dot-gray{width:9px;height:9px;border-radius:50%;background:var(--text3);flex-shrink:0;}

/* KONTROLL ITEM */
.kontroll-item{padding:12px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .1s;}
.kontroll-item:hover{background:var(--bg3);}
.kontroll-item:last-child{border-bottom:none;}
.kontroll-item.status-red{background:rgba(163,45,45,.03);}
.kontroll-item.status-amber{background:rgba(133,79,11,.03);}
.kontroll-name{font-size:14px;font-weight:500;flex:1;}
.kontroll-sub{font-size:11px;color:var(--text3);margin-top:2px;}

/* LATE BADGE */
.late-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;
  background:var(--amber-bg);color:var(--amber);white-space:nowrap;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;
  max-width:520px;max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;
  margin:10px auto 4px;}
.modal-header{padding:10px 18px 14px;border-bottom:1px solid var(--border);}
.modal-title{font-size:16px;font-weight:600;}
.modal-sub{font-size:12px;color:var(--text3);margin-top:3px;}
.modal-body{padding:18px;}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);
  display:flex;gap:8px;}

/* FORM */
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:11px;font-weight:600;color:var(--text2);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.form-field input,.form-field select,.form-field textarea{width:100%;
  padding:11px 14px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radius);font-size:15px;color:var(--text);font-family:inherit;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(59,109,17,.1);}
.form-field textarea{resize:vertical;min-height:70px;}

/* BUTTONS */
.btn{padding:10px 16px;border-radius:var(--radius);font-size:14px;font-weight:500;
  cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text2);}
.btn-primary{background:var(--green);color:#fff;border-color:transparent;}
.btn-primary:active{background:var(--green2);}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:rgba(163,45,45,.2);}
.btn-full{width:100%;justify-content:center;padding:13px;}

/* DRUM PICKER */
.drum-wrap{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0;}
.drum-col{display:flex;flex-direction:column;align-items:center;}
.drum-label{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500;text-transform:uppercase;}
.drum{width:88px;height:160px;overflow:hidden;position:relative;border-radius:12px;
  background:var(--bg3);border:1px solid var(--border2);}
.drum-inner{position:relative;}
.drum-item{height:40px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:500;color:var(--text3);transition:none;user-select:none;}
.drum-item.selected{color:var(--text);font-size:28px;font-weight:600;}
.drum-select{position:absolute;top:50%;left:0;right:0;height:40px;
  transform:translateY(-50%);border-top:2px solid var(--green);
  border-bottom:2px solid var(--green);pointer-events:none;border-radius:0;}
.drum-fade-top{position:absolute;top:0;left:0;right:0;height:60px;
  background:linear-gradient(to bottom,var(--bg3),transparent);pointer-events:none;z-index:1;}
.drum-fade-bot{position:absolute;bottom:0;left:0;right:0;height:60px;
  background:linear-gradient(to top,var(--bg3),transparent);pointer-events:none;z-index:1;}

/* TEMP RESULT */
.temp-result{text-align:center;padding:12px;margin-bottom:14px;border-radius:var(--radius);}
.temp-result.ok{background:var(--green-bg);}
.temp-result.warn{background:var(--red-bg);}
.temp-result-val{font-size:32px;font-weight:700;}
.temp-result.ok .temp-result-val{color:var(--green);}
.temp-result.warn .temp-result-val{color:var(--red);}
.temp-result-lbl{font-size:13px;color:var(--text2);margin-top:4px;}

/* AVVIKELSE */
.avvik-field{display:none;background:var(--red-bg);border-radius:var(--radius);
  padding:12px;margin-bottom:14px;}
.avvik-field.show{display:block;}
.avvik-field label{color:var(--red);font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px;}
.avvik-field textarea{width:100%;padding:10px;border:1px solid rgba(163,45,45,.3);
  border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:60px;
  background:var(--bg2);}

/* GRAPH */
.graph-wrap{padding:12px 14px 4px;}
.graph-svg{width:100%;overflow:visible;}

/* HISTORIK */
.hist-row{padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;}
.hist-row:last-child{border-bottom:none;}
.hist-val{font-size:16px;font-weight:600;min-width:56px;}
.hist-info{flex:1;}
.hist-name{font-size:13px;font-weight:500;}
.hist-meta{font-size:11px;color:var(--text3);margin-top:2px;}

/* MÅNADSÖVERSIKT */
.manad-row{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.manad-row:last-child{border-bottom:none;}
.prog-bar{flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;background:var(--green);}
.prog-fill.warn{background:var(--amber);}
.prog-fill.danger{background:var(--red);}

/* ADMIN */
.prog-item{padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;}
.prog-item:last-child{border-bottom:none;}
.type-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:15px;flex-shrink:0;}
.type-temp{background:var(--blue-bg);color:var(--blue);}
.type-janej{background:var(--green-bg);color:var(--green);}
.type-text{background:var(--amber-bg);color:var(--amber);}
.type-lev{background:var(--purple-bg);color:var(--purple);}

/* SIGNERING */
.sign-box{background:var(--blue-bg);border:1px solid rgba(26,79,122,.2);
  border-radius:12px;padding:16px;margin-bottom:14px;}

/* CHIPS */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;
  border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;}
.chip.active{background:var(--green);color:#fff;border-color:transparent;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:12px;text-align:center;}
.kpi-val{font-size:22px;font-weight:700;}
.kpi-lbl{font-size:11px;color:var(--text3);margin-top:2px;}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--text);color:#fff;border-radius:12px;padding:12px 20px;
  font-size:13px;z-index:999;opacity:0;transition:all .25s;pointer-events:none;
  display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:var(--shadow);}


/* RAPPORT */
.rapport-chips{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.rapport-chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;
  border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;}
.rapport-chip.active{background:var(--green);color:#fff;border-color:transparent;}
.period-sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.period-sel select{padding:8px 12px;background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius);font-size:13px;color:var(--text);font-family:inherit;}

/* MATRIX */
.matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;}
.matrix-table{border-collapse:collapse;font-size:12px;white-space:nowrap;}
.matrix-table th{padding:4px 3px;text-align:center;font-weight:600;font-size:10px;
  color:var(--text3);border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--bg2);}
.matrix-table th.name-col{text-align:left;padding-left:8px;min-width:160px;max-width:200px;
  position:sticky;left:0;background:var(--bg2);z-index:2;}
.matrix-table td{padding:3px;text-align:center;border-bottom:1px solid var(--border);}
.matrix-table td.name-col{text-align:left;padding:6px 8px;font-size:12px;
  font-weight:500;position:sticky;left:0;background:var(--bg2);max-width:200px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--border2);}
.matrix-table tr:hover td{background:var(--bg3);}
.matrix-table tr:hover td.name-col{background:var(--bg3);}
.matrix-group-row th{background:var(--bg3);color:var(--text2);font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;
  text-align:left;border-top:2px solid var(--border2);}
.matrix-cell{width:22px;height:22px;border-radius:4px;cursor:pointer;
  display:inline-block;transition:transform .1s;}
.matrix-cell:hover{transform:scale(1.2);}
.mc-ok   {background:var(--green);}
.mc-late {background:var(--amber);}
.mc-avvik{background:var(--red);}
.mc-miss {background:rgba(163,45,45,.15);}
.mc-none {background:transparent;}
.mc-gray {background:var(--bg4);}
.day-red {color:var(--red);}
.day-today{font-weight:700;color:var(--green);}

@media(min-width:600px){.view{padding:18px 20px 80px;}}
</style>
</head>
<body>

<div id="topbar">
  <div class="tb-logo"><i class="ti ti-clipboard-check"></i> Kontrollprogram</div>
  <div class="tb-spacer"></div>
  <span class="tb-role" id="tb-role">Personal</span>
  <a href="index.html" class="tb-btn"><i class="ti ti-arrow-left"></i> Portal</a>
  <button class="tb-btn tb-btn-danger" onclick="portalLogout()"><i class="ti ti-logout"></i> Logga ut</button>
</div>

<div class="tabs" id="main-tabs">
  <button class="tab active" id="tab-dag" onclick="showTab('dag')"><i class="ti ti-checklist"></i> Dagens kontroller</button>
  <button class="tab" id="tab-lev" onclick="showTab('lev')"><i class="ti ti-truck"></i> Leverans</button>
  <button class="tab" id="tab-hist" onclick="showTab('hist')"><i class="ti ti-report"></i> Kontrollrapport</button>
  <button class="tab" id="tab-manad" onclick="showTab('manad')" style="display:none"><i class="ti ti-calendar-stats"></i> Månadsrapport</button>
  <button class="tab" id="tab-admin" onclick="showTab('admin')" style="display:none"><i class="ti ti-settings"></i> Admin</button>
</div>

<!-- GLOBAL ADMIN: ANLÄGGNINGSVÄLJARE -->
<div id="anlaggning-picker" style="display:none;background:var(--bg2);border-bottom:1px solid var(--border2);padding:10px 14px">
  <div style="display:flex;align-items:center;gap:10px;max-width:600px">
    <i class="ti ti-building" style="color:var(--green);font-size:18px;flex-shrink:0"></i>
    <select id="global-anlaggning-select" onchange="onGlobalAnlaggningChange()" style="flex:1;padding:9px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);font-size:14px;font-family:inherit;color:var(--text)">
                <option value="">– Välj anläggning –</option>
                <optgroup label="Campingar">
                  <option value="ostnora">Östnora</option>
                  <option value="orstig">Örstig</option>
                  <option value="mista">Mista</option>
                  <option value="storsved">Storsved</option>
                  <option value="kapellskar">Kapellskär</option>
                  <option value="bo_camp">Björkö Örns Camping</option>
                  <option value="graddos">Gräddös Pärla</option>
                  <option value="angsudden">Ängsudden</option>
                </optgroup>
                <optgroup label="Restauranger &amp; Kök">
                  <option value="ostnora_rest">Östnora Kök &amp; Bar</option>
                  <option value="graddos_rest">Gräddös Pärla Kök &amp; Bar</option>
                  <option value="bo_camp_rest">Björkö Örns Restaurang</option>
                  <option value="kapellskar_rest">Kapellskärs Café</option>
                  <option value="orstig_rest">Örstigs Kiosk</option>
                  <option value="mista_rest">Mista Kiosk</option>
                  <option value="storsved_rest">Storsveds Kiosk</option>
                  <option value="angsudden_rest">Ängsuddens Kiosk</option>
                </optgroup>
    </select>
  </div>
</div>

<div class="view active" id="view-dag"></div>
<div class="view" id="view-lev"></div>
<div class="view" id="view-hist"></div>
<div class="view" id="view-manad"></div>
<div class="view" id="view-admin"></div>

<!-- MODAL: UTFÖRA KONTROLL -->
<div class="modal-overlay" id="modal-kontroll">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="mk-title">Kontroll</div>
      <div class="modal-sub" id="mk-sub"></div>
    </div>
    <div class="modal-body" id="mk-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-kontroll')" style="flex:1;justify-content:center">Avbryt</button>
      <button class="btn btn-primary" id="mk-save" onclick="saveKontroll()" style="flex:2;justify-content:center"><i class="ti ti-check"></i> Spara</button>
    </div>
  </div>
</div>

<!-- MODAL: LEVERANSKONTROLL -->
<div class="modal-overlay" id="modal-lev">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Leveranskontroll</div>
      <div class="modal-sub" id="ml-anlaggning"></div>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label>Leverantör</label>
        <select id="lev-leverantor"></select>
      </div>
      <div class="form-field">
        <label>Produkt</label>
        <input type="text" id="lev-produkt" placeholder="T.ex. kycklingfilé">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-field">
          <label>Bäst-före</label>
          <input type="date" id="lev-bast">
        </div>
        <div class="form-field">
          <label>Temp (°C)</label>
          <input type="number" id="lev-temp" step="0.1" placeholder="+3">
        </div>
      </div>
      <div class="form-field">
        <label>Förpackning</label>
        <div style="display:flex;gap:14px;margin-top:6px">
          <label style="display:flex;align-items:center;gap:6px;font-size:15px;text-transform:none;letter-spacing:0"><input type="radio" name="lev-fp" value="hel" checked> Hel</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:15px;text-transform:none;letter-spacing:0"><input type="radio" name="lev-fp" value="skadad"> Skadad</label>
        </div>
      </div>
      <div class="form-field">
        <label>Godkänd</label>
        <div style="display:flex;gap:14px;margin-top:6px">
          <label style="display:flex;align-items:center;gap:6px;font-size:15px;text-transform:none;letter-spacing:0"><input type="radio" name="lev-gk" value="ja" checked> Ja</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:15px;text-transform:none;letter-spacing:0"><input type="radio" name="lev-gk" value="nej"> Nej</label>
        </div>
      </div>
      <div class="form-field">
        <label>Kommentar</label>
        <textarea id="lev-kommentar" placeholder="Valfri kommentar…" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-lev')" style="flex:1;justify-content:center">Avbryt</button>
      <button class="btn btn-primary" onclick="saveLev()" style="flex:2;justify-content:center"><i class="ti ti-check"></i> Spara</button>
    </div>
  </div>
</div>

<!-- MODAL: SIGNERINGSÖVERSIKT -->
<div class="modal-overlay" id="modal-sign">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="sign-title">Signera månad</div>
      <div class="modal-sub" id="sign-sub"></div>
    </div>
    <div class="modal-body" id="sign-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-sign')" style="flex:1;justify-content:center">Avbryt</button>
      <button class="btn btn-primary" onclick="doSignera()" style="flex:2;justify-content:center"><i class="ti ti-writing-sign"></i> Signera</button>
    </div>
  </div>
</div>

<!-- MODAL: CELL DETALJ -->
<div class="modal-overlay" id="modal-cell">
  <div class="modal" style="max-width:400px">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="cell-title">Kontrolldetalj</div>
      <div class="modal-sub" id="cell-sub"></div>
    </div>
    <div class="modal-body" id="cell-body"></div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-full" onclick="closeModal('modal-cell')">Stäng</button>
    </div>
  </div>
</div>

<!-- MODAL: NY/REDIGERA KONTROLLPUNKT -->
<div class="modal-overlay" id="modal-punkt">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="mp-title">Ny kontrollpunkt</div>
    </div>

<div id="toast"></div>

<script>
var GH_REPO = 'CCSthlm/besiktning-camping';
var KBASE   = 'egenkontrollprogram';
var _user   = null, _roles = [], _isAnsvarig = false, _isAdmin = false;
var _anlaggningId = '', _anlaggningNamn = '';
var _program = []; // kontrollpunkter
var _utfall  = {}; // {punktId: {varde,ts,av,forSent,forsentMinuter,avvikelse}}
var _leveranser = [];
var _leverantorer = [];
var _signaturer = {};
var _currentPunktId = null;
var _anlaggningar = [];
var _drumValues = {}; // {drumId: currentValue}
var _drumDrag  = {}; // touch drag state

// ── GITHUB ────────────────────────────────────────────────────────────────
async function ghGet(path){
  var token=localStorage.getItem('gh_token')||'';
  if(!token)return null;
  try{
    var r=await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,
      {headers:{'Authorization':'token '+token}});
    if(!r.ok)return null;
    var g=await r.json();
    var b=Uint8Array.from(atob(g.content.split('\n').join('')),function(c){return c.charCodeAt(0);});
    return{data:JSON.parse(new TextDecoder('utf-8').decode(b)),sha:g.sha};
  }catch(e){return null;}
}
async function ghPut(path,data,msg){
  var token=localStorage.getItem('gh_token')||'';
  if(!token){toast('Token saknas','err');return false;}
  var chk=await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,
    {headers:{'Authorization':'token '+token}});
  var sha=chk.ok?(await chk.json()).sha:null;
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  var payload={message:msg||'Kontroll update',content,branch:'main'};
  if(sha)payload.sha=sha;
  var r=await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,
    {method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},
     body:JSON.stringify(payload)});
  return r.ok;
}

// ── INIT ──────────────────────────────────────────────────────────────────
async function init(){
  var sess=sessionStorage.getItem('ccs_session')||sessionStorage.getItem('ccs_portal_user');
  if(!sess){window.location.replace('index.html');return;}
  try{_user=JSON.parse(sess);}catch(e){window.location.replace('index.html');return;}
  _roles=_user.adminRoles||[];
  _isAnsvarig=_roles.includes('kontroll-ansvarig')||_roles.includes('global');
  _isAdmin=_roles.includes('kontroll-admin')||_roles.includes('global');

  // Determine anlaggning based on role — global gets all, others get assigned
  if (_roles.includes('global')) {
    _anlaggningId = ''; // global sees all — handled in UI
    _anlaggningNamn = 'Alla anläggningar';
  } else if (_roles.includes('kontroll-personal')) {
    _anlaggningId = _user.kontrollAnlaggningId || '';
    _anlaggningNamn = _user.kontrollAnlaggningNamn || _anlaggningId;
  } else if (_roles.includes('kontroll-ansvarig')) {
    _anlaggningId = _user.kontrollAnsvarigAnlaggningId || '';
    _anlaggningNamn = _user.kontrollAnsvarigAnlaggningNamn || _anlaggningId || 'Alla anläggningar';
  } else if (_roles.includes('kontroll-admin')) {
    _anlaggningId = _user.kontrollAdminAnlaggningId || '';
    _anlaggningNamn = _user.kontrollAdminAnlaggningNamn || _anlaggningId || 'Alla anläggningar';
  }

  var roleLabel=_isAdmin?'Admin':_isAnsvarig?'Ansvarig':'Personal';
  document.getElementById('tb-role').textContent=roleLabel;
  if(_isAnsvarig)document.getElementById('tab-manad').style.display='';
  if(_isAdmin)document.getElementById('tab-admin').style.display='';

  // Show global picker for global/admin with no assigned anlaggning
  var needsPicker = _roles.includes('global') || (_isAdmin && !_anlaggningId) || (_isAnsvarig && !_anlaggningId);
  if (needsPicker) {
    document.getElementById('anlaggning-picker').style.display = '';
    document.getElementById('view-dag').innerHTML =
      '<div style="text-align:center;padding:60px 20px;color:var(--text3)">'
      +'<i class="ti ti-building" style="font-size:48px;display:block;margin-bottom:12px"></i>'
      +'<div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px">Välj anläggning</div>'
      +'<p style="font-size:13px">Välj en anläggning i listan ovan för att se kontroller.</p>'
      +'</div>';
    return;
  }

  if(!_anlaggningId){
    document.getElementById('view-dag').innerHTML='<div style="text-align:center;padding:48px 20px"><i class="ti ti-lock" style="font-size:48px;display:block;margin-bottom:12px;color:var(--text3)"></i><div style="font-size:16px;font-weight:600;margin-bottom:8px">Ingen anläggning tilldelad</div><p style="font-size:13px;color:var(--text2)">Kontakta administratören.</p></div>';
    return;
  }

  await loadAll();
  showTab('dag');
}

var _igårUtfall = {};

var ANLAGGNING_NAMN_MAP = {
  ostnora:'Östnora', orstig:'Örstig', mista:'Mista', storsved:'Storsved',
  kapellskar:'Kapellskär', bo_camp:'Björkö Örns Camping', graddos:'Gräddös Pärla',
  angsudden:'Ängsudden', ostnora_rest:'Östnora Kök & Bar',
  graddos_rest:'Gräddös Pärla Kök & Bar', bo_camp_rest:'Björkö Örns Restaurang',
  kapellskar_rest:'Kapellskärs Café', orstig_rest:'Örstigs Kiosk',
  mista_rest:'Mista Kiosk', storsved_rest:'Storsveds Kiosk',
  angsudden_rest:'Ängsuddens Kiosk'
};

async function onGlobalAnlaggningChange() {
  var sel = document.getElementById('global-anlaggning-select');
  var id  = sel ? sel.value : '';
  if (!id) return;
  _anlaggningId   = id;
  _anlaggningNamn = ANLAGGNING_NAMN_MAP[id] || id;
  // Show loading
  ['dag','lev','hist','manad','admin'].forEach(function(t){
    var el = document.getElementById('view-'+t);
    if (el) el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3)"><i class="ti ti-loader" style="font-size:32px"></i></div>';
  });
  await loadAll();
  showTab('dag');
}

async function loadAll(){
  var prog=await ghGet(KBASE+'/settings/program_'+_anlaggningId+'.json');
  _program=(prog&&prog.data&&prog.data.punkter)||[];
  var today=todayStr();
  var utfall=await ghGet(KBASE+'/utfall/'+_anlaggningId+'/'+today+'.json');
  _utfall=(utfall&&utfall.data)||{};
  // Load yesterday to detect missed daily kontroller
  var yd=new Date(); yd.setDate(yd.getDate()-1);
  var ydStr=yd.toISOString().slice(0,10);
  var igår=await ghGet(KBASE+'/utfall/'+_anlaggningId+'/'+ydStr+'.json');
  _igårUtfall=(igår&&igår.data)||{};
  var levR=await ghGet(KBASE+'/leverans/'+_anlaggningId+'/'+today+'.json');
  _leveranser=(levR&&levR.data&&levR.data.leveranser)||[];
  var anlR=await ghGet(KBASE+'/settings/anlaggningar.json');
  _anlaggningar=(anlR&&anlR.data&&anlR.data.anlaggningar)||[];
  var levS=await ghGet(KBASE+'/settings/leverantorer.json');
  _leverantorer=(levS&&levS.data&&levS.data.leverantorer)||['Menigo','Martin & Servera','Arla','Scan','ICA Maxi'];
  var signs=await ghGet(KBASE+'/signaturer/'+_anlaggningId+'.json');
  _signaturer=(signs&&signs.data)||{};
}

// ── TABS ──────────────────────────────────────────────────────────────────
function showTab(tab){
  ['dag','lev','hist','manad','admin'].forEach(function(t){
    document.getElementById('view-'+t).classList.toggle('active',t===tab);
    var el=document.getElementById('tab-'+t);
    if(el)el.classList.toggle('active',t===tab);
  });
  var renders={dag:renderDag,lev:renderLev,hist:renderHist,manad:renderManad,admin:renderAdmin};
  if(renders[tab])renders[tab]();
}

// ── DAGENS KONTROLLER ─────────────────────────────────────────────────────
function getPunktStatus(p){
  if(_utfall[p.id]) return _utfall[p.id].forSent?'late':'done';
  var hour=new Date().getHours();
  if(p.intervall==='dagligen'){
    // Red = was not done yesterday (and today's not done either)
    if(_igårUtfall && !_igårUtfall[p.id]) return 'red';
    if(hour<10) return 'gray';   // Before 10:00 — not yet required
    return 'amber';              // 10:00–23:59 — should be done today
  }
  if(p.intervall==='veckovis'){
    return new Date().getDay()===1 ? 'amber' : 'gray';
  }
  if(p.intervall==='varje_anvandning') return 'amber';
  return 'gray';
}

function renderDag(){
  if(!_program.length){
    document.getElementById('view-dag').innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text3)"><i class="ti ti-clipboard" style="font-size:48px;display:block;margin-bottom:12px"></i><p>Inga kontrollpunkter inlagda ännu.</p></div>';
    return;
  }

  var done=_program.filter(function(p){return _utfall[p.id];}).length;
  var pct=Math.round(done/_program.length*100);

  // Check if current month is signed
  var now2=new Date();
  var mk=now2.getFullYear()+'-'+(now2.getMonth()<9?'0':'')+(now2.getMonth()+1);
  var isSignedMonth=_signaturer&&_signaturer[mk];
  var lockedBanner=isSignedMonth
    ?'<div style="background:var(--blue-bg);border:1px solid rgba(26,79,122,.2);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--blue)">'
      +'<i class="ti ti-lock" style="font-size:16px;flex-shrink:0"></i>'
      +'<span>Månaden är signerad och låst av <strong>'+_signaturer[mk].av+'</strong> ('+_signaturer[mk].ts.slice(0,10)+'). Inga nya kontroller kan registreras.</span>'
      +'</div>'
    :'';

  // Deadline text per intervall
  var DAYS=['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];

  function deadlineText(p){
    if(_utfall[p.id]) return '';
    var dl=p.deadline||{};
    var status=getPunktStatus(p);
    var now=new Date();

    if(p.intervall==='dagligen'){
      var tid=dl.tid||'23:59';
      if(status==='red') return 'Missad – borde gjorts igår senast '+tid;
      if(status==='amber') return 'Senast idag '+tid;
      return 'Kan göras från 10:00 (senast '+tid+')';
    }
    if(p.intervall==='varje_anvandning'||p.intervall==='vid_behov') return '';
    if(p.intervall==='veckovis'){
      var dagNr=parseInt(dl.dag||'0');
      var tid=dl.tid||'22:00';
      var today=now.getDay();
      var daysTo=(dagNr-today+7)%7;
      if(daysTo===0) return 'Senast idag ('+DAYS[dagNr]+') '+tid;
      return 'Senast '+DAYS[dagNr]+' '+tid+' (om '+daysTo+' dag'+(daysTo===1?'':'ar')+')';
    }
    if(p.intervall==='manadsvis'){
      var tid=dl.tid||'23:00';
      if(dl.typ==='sista_sun'){
        // Find last sunday of month
        var lastDay=new Date(now.getFullYear(),now.getMonth()+1,0);
        while(lastDay.getDay()!==0) lastDay.setDate(lastDay.getDate()-1);
        var dLeft=Math.round((lastDay-now)/86400000);
        return 'Senast sista söndagen den '+lastDay.getDate()+'/'+(now.getMonth()+1)+' '+tid+(dLeft>=0?' ('+dLeft+' dagar kvar)':'');
      } else {
        var dag=parseInt(dl.dag||'30');
        var lastInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
        var actualDag=Math.min(dag,lastInMonth);
        var dLeft=actualDag-now.getDate();
        return 'Senast den '+actualDag+'/'+( now.getMonth()+1)+' '+tid+(dLeft>0?' ('+dLeft+' dagar kvar)':dLeft===0?' (idag)':' (passerat)');
      }
    }
    return '';
  }

  // Group order and labels
  var GROUPS = [
    {id:'varje_anvandning', label:'Varje användning',   icon:'ti-refresh'},
    {id:'dagligen',         label:'Dagligen',            icon:'ti-sun'},
    {id:'veckovis',         label:'Veckovis',            icon:'ti-calendar-week'},
    {id:'manadsvis',        label:'Månadsvis',           icon:'ti-calendar-month'},
    {id:'vid_behov',        label:'Vid behov',           icon:'ti-dots'},
  ];

  var groupsHtml = GROUPS.map(function(grp){
    var punkter = _program.filter(function(p){ return p.intervall===grp.id; });
    if(!punkter.length) return '';

    var itemsHtml = punkter.map(function(p){
      var status  = getPunktStatus(p);
      var utfall  = _utfall[p.id];
      var dotClass='dot-gray', itemClass='';
      var mainSub='', deadlineSub='';

      if(utfall){
        dotClass='dot-green';
        var valTxt=utfall.varde+(p.typ==='temp'?' °C':'');
        mainSub=valTxt+' · '+utfall.av+' · '+utfall.ts.slice(11,16);
      } else {
        if(status==='red'){  dotClass='dot-red';   itemClass='status-red';   }
        else if(status==='amber'){ dotClass='dot-amber'; itemClass='status-amber'; }
        deadlineSub = deadlineText(p);
      }

      return '<div class="kontroll-item '+itemClass+'" onclick="openKontroll(\''+p.id+'\')">'
        +'<div class="'+dotClass+'"></div>'
        +'<div style="flex:1;min-width:0">'
        +'<div class="kontroll-name">'+p.namn+'</div>'
        +(mainSub?'<div class="kontroll-sub">'+mainSub+'</div>':'')
        +(deadlineSub?'<div class="kontroll-sub" style="color:'+(status==='red'?'var(--red)':status==='amber'?'var(--amber)':'var(--text3)')+'"><i class="ti ti-clock" style="font-size:10px"></i> '+deadlineSub+'</div>':'')
        +'</div>'
        +(utfall&&utfall.forSent?'<span class="late-badge">+'+utfall.forsentMinutter+'min sen</span>':'')
        +(utfall
          ?'<i class="ti ti-check" style="font-size:18px;color:var(--green)"></i>'
          :'<i class="ti ti-chevron-right" style="font-size:18px;color:var(--text3)"></i>')
        +'</div>';
    }).join('');

    var groupDone  = punkter.filter(function(p){return _utfall[p.id];}).length;
    var groupTotal = punkter.length;
    var hasRed     = punkter.some(function(p){return getPunktStatus(p)==='red'&&!_utfall[p.id];});
    var headerColor= hasRed ? 'var(--red)' : 'var(--text2)';

    return '<div style="margin-bottom:12px">'
      +'<div style="display:flex;align-items:center;gap:7px;padding:6px 4px;margin-bottom:4px">'
      +'<i class="ti '+grp.icon+'" style="font-size:14px;color:'+headerColor+'"></i>'
      +'<span style="font-size:12px;font-weight:600;color:'+headerColor+';text-transform:uppercase;letter-spacing:.05em">'+grp.label+'</span>'
      +'<span style="font-size:11px;color:var(--text3);margin-left:auto">'+groupDone+'/'+groupTotal+'</span>'
      +'</div>'
      +'<div class="card">'+itemsHtml+'</div>'
      +'</div>';
  }).join('');

  document.getElementById('view-dag').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<div><div style="font-size:17px;font-weight:700">Idag</div>'
    +'<div style="font-size:12px;color:var(--text2)">'+_anlaggningNamn+' · '+todayStr()+'</div></div>'
    +'<div style="text-align:right"><div style="font-size:20px;font-weight:700;color:var(--green)">'+done+'/'+_program.length+'</div>'
    +'<div style="font-size:11px;color:var(--text3)">klara</div></div>'
    +'</div>'
    +'<div style="height:6px;background:var(--border2);border-radius:3px;margin-bottom:16px;overflow:hidden">'
    +'<div style="height:100%;width:'+pct+'%;background:var(--green);border-radius:3px;transition:width .3s"></div></div>'
    +lockedBanner
    +groupsHtml;
}

// ── DRUM PICKER ───────────────────────────────────────────────────────────
function buildDrumScale(id, items, initIdx){
  _drumValues[id] = items[initIdx];
  var itemsHtml = items.map(function(v,i){
    var isSelected = i===initIdx;
    var color = parseFloat(v)>=0 ? '' : 'color:#1a4f7a;';
    return '<div class="drum-item'+(isSelected?' selected':'')+'" data-val="'+v+'" style="'+color+'">'
      +(parseFloat(v)>0?'+':'')+v+'°C'
      +'</div>';
  }).join('');

  return '<div class="drum-col">'
    +'<div class="drum-label">Temperatur</div>'
    +'<div class="drum" id="drum-'+id+'" data-id="'+id+'" data-idx="'+initIdx+'" '
    +'data-items="'+encodeURIComponent(JSON.stringify(items))+'" '
    +'style="width:130px">'
    +'<div class="drum-fade-top"></div>'
    +'<div class="drum-fade-bot"></div>'
    +'<div class="drum-select"></div>'
    +'<div class="drum-inner" id="drum-inner-'+id+'" style="transform:translateY('+(2-initIdx)*40+'px)">'+itemsHtml+'</div>'
    +'</div>'
    +'</div>';
}

function buildDrum(id, items, initial, label){
  var idx=items.indexOf(initial);
  if(idx<0)idx=Math.floor(items.length/2);
  _drumValues[id]=items[idx];
  var itemsHtml=items.map(function(v,i){
    return '<div class="drum-item'+(i===idx?' selected':'')+'" data-val="'+v+'">'+v+'</div>';
  }).join('');
  return '<div class="drum-col">'
    +'<div class="drum-label">'+label+'</div>'
    +'<div class="drum" id="drum-'+id+'" data-id="'+id+'" data-idx="'+idx+'" data-items="'+encodeURIComponent(JSON.stringify(items))+'">'
    +'<div class="drum-fade-top"></div><div class="drum-fade-bot"></div>'
    +'<div class="drum-select"></div>'
    +'<div class="drum-inner" id="drum-inner-'+id+'" style="transform:translateY('+(2-idx)*40+'px)">'+itemsHtml+'</div>'
    +'</div>'
    +'</div>';
}

function initDrums(){
  document.querySelectorAll('.drum').forEach(function(drum){
    var id=drum.dataset.id;
    drum.addEventListener('touchstart',function(e){
      _drumDrag[id]={startY:e.touches[0].clientY,startIdx:parseInt(drum.dataset.idx)};
      e.preventDefault();
    },{passive:false});
    drum.addEventListener('touchmove',function(e){
      if(!_drumDrag[id])return;
      var dy=e.touches[0].clientY-_drumDrag[id].startY;
      var items=JSON.parse(decodeURIComponent(drum.dataset.items));
      var delta=Math.round(-dy/40);
      var newIdx=Math.max(0,Math.min(items.length-1,_drumDrag[id].startIdx+delta));
      setDrumIdx(drum,id,newIdx,items);
      e.preventDefault();
    },{passive:false});
    drum.addEventListener('touchend',function(){_drumDrag[id]=null;});
    // Mouse for desktop testing
    drum.addEventListener('wheel',function(e){
      var items=JSON.parse(decodeURIComponent(drum.dataset.items));
      var idx=parseInt(drum.dataset.idx);
      var newIdx=Math.max(0,Math.min(items.length-1,idx+(e.deltaY>0?1:-1)));
      setDrumIdx(drum,id,newIdx,items);
      e.preventDefault();
    },{passive:false});
  });
}

function setDrumIdx(drum,id,newIdx,items){
  drum.dataset.idx=newIdx;
  _drumValues[id]=items[newIdx];
  var inner=document.getElementById('drum-inner-'+id);
  inner.style.transform='translateY('+(2-newIdx)*40+'px)';
  inner.querySelectorAll('.drum-item').forEach(function(el,i){
    el.classList.toggle('selected',i===newIdx);
  });
  onDrumChange();
}

function onDrumChange(){
  // Single scale drum
  if(_drumValues['temp-scale']!==undefined){
    var val=parseFloat(_drumValues['temp-scale']);
    updateTempResult(val);
    return;
  }
  // Legacy three-drum fallback
  var sign=_drumValues['temp-sign']||'+';
  var whole=parseInt(_drumValues['temp-whole']||0);
  var dec=parseInt(_drumValues['temp-dec']||0);
  var val=parseFloat(sign+''+whole+'.'+dec);
  updateTempResult(val);
}

function updateTempResult(val){
  var p=_program.find(function(x){return x.id===_currentPunktId;});
  if(!p)return;
  var ok=true;
  var msg='Inom gränsvärde';
  if(p.min!==undefined&&p.min!==null&&p.min!==''&&val<parseFloat(p.min)){ok=false;msg='Under min ('+p.min+'°C)';}
  if(p.max!==undefined&&p.max!==null&&p.max!==''&&val>parseFloat(p.max)){ok=false;msg='Över max ('+p.max+'°C)';}
  var res=document.getElementById('temp-result');
  if(!res)return;
  res.className='temp-result '+(ok?'ok':'warn');
  res.querySelector('.temp-result-val').textContent=(val>0?'+':'')+val.toFixed(1)+'°C';
  res.querySelector('.temp-result-lbl').textContent=ok?('✓ '+msg):('✗ '+msg);
  var avvik=document.getElementById('avvik-field');
  if(avvik)avvik.className='avvik-field'+(ok?'':' show');
}

// ── OPEN KONTROLL MODAL ───────────────────────────────────────────────────
function openKontroll(punktId){
  var p=_program.find(function(x){return x.id===punktId;});
  if(!p)return;
  _currentPunktId=punktId;
  var utfall=_utfall[punktId];
  var isMissed=!utfall&&getPunktStatus(p)==='red';

  document.getElementById('mk-title').textContent=p.namn;
  document.getElementById('mk-sub').textContent=
    (p.referens?p.referens+' · ':'')+p.kategori+(isMissed?' · ⚠ Försenad':'');

  var prevHtml='';
  if(utfall){
    prevHtml='<div style="background:var(--green-bg);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px">'
      +'<span style="color:var(--green2);font-weight:500">Redan utförd idag: </span>'
      +utfall.varde+(p.typ==='temp'?' °C':'')+' · '+utfall.ts.slice(11,16)
      +'</div>';
  }

  var forsenInfo=isMissed?'<div style="background:var(--amber-bg);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--amber)"><i class="ti ti-clock" style="font-size:13px"></i> Missad kontroll – markeras som för sent utförd</div>':'';

  var body='';
  if(p.typ==='temp'){
    var pMin = p.min!==undefined&&p.min!==''&&p.min!==null ? parseFloat(p.min) : null;
    var pMax = p.max!==undefined&&p.max!==''&&p.max!==null ? parseFloat(p.max) : null;

    // Smart start value:
    // 1. Last reading if exists
    // 2. Midpoint if both min+max
    // 3. Max if only max (e.g. kyl)
    // 4. Min if only min (e.g. diskmaskin)
    // 5. Fallback 4
    var initVal;
    if(utfall){
      initVal = parseFloat(utfall.varde);
    } else if(pMin!==null && pMax!==null){
      initVal = Math.round((pMin+pMax)/2*10)/10; // midpoint
    } else if(pMax!==null){
      initVal = pMax - 2; // just below max (e.g. kyl: max 8 → start at 6)
    } else if(pMin!==null){
      initVal = pMin + 2; // just above min (e.g. disk: min 60 → start at 62)
    } else {
      initVal = 4;
    }

    // Scale: ±10 degrees around startVal, but also cover min/max
    var scaleCenter = initVal;
    var scaleMin = scaleCenter - 10;
    var scaleMax = scaleCenter + 10;
    if(pMin!==null) scaleMin = Math.min(scaleMin, pMin - 3);
    if(pMax!==null) scaleMax = Math.max(scaleMax, pMax + 3);
    // Round to integers
    scaleMin = Math.floor(scaleMin);
    scaleMax = Math.ceil(scaleMax);

    // Build scale as 0.5-step values: e.g. -5.0, -4.5, ... +10.0
    var scaleValues = [];
    for(var sv=scaleMin*2; sv<=scaleMax*2; sv++){
      scaleValues.push((sv/2).toFixed(1));
    }

    // Find initial index
    var initStr = initVal.toFixed(1);
    var initIdx = scaleValues.indexOf(initStr);
    if(initIdx<0) initIdx = Math.floor(scaleValues.length/2);

    // Show scale info
    var scaleInfo = '';
    if(pMin!==null||pMax!==null){
      scaleInfo = '<div style="text-align:center;font-size:11px;color:var(--text3);margin-bottom:6px">'
        +'Skala: '+(pMin!==null?'min '+pMin+'°C':'')+(pMin!==null&&pMax!==null?' – ':'')+(pMax!==null?'max '+pMax+'°C':'')
        +' &nbsp;|&nbsp; Rulla för att välja'
        +'</div>';
    }

    body=forsenInfo+prevHtml
      +'<div id="temp-result" class="temp-result ok">'
      +'<div class="temp-result-val">+0.0°C</div>'
      +'<div class="temp-result-lbl">–</div>'
      +'</div>'
      +scaleInfo
      +'<div class="drum-wrap" style="justify-content:center">'
      +buildDrumScale('temp-scale', scaleValues, initIdx)
      +'</div>'
      +'<div class="avvik-field" id="avvik-field">'
      +'<label>Åtgärd (obligatorisk vid avvikelse)</label>'
      +'<textarea id="avvik-text" placeholder="Beskriv vidtagen åtgärd…"></textarea>'
      +'</div>';
  } else if(p.typ==='janej'){
    body=forsenInfo+prevHtml
      +'<div style="display:flex;gap:12px;margin-bottom:14px">'
      +'<button class="btn" id="btn-ja" onclick="setJaNej(true)" style="flex:1;justify-content:center;font-size:16px;padding:16px"><i class="ti ti-check" style="color:var(--green)"></i> Ja</button>'
      +'<button class="btn" id="btn-nej" onclick="setJaNej(false)" style="flex:1;justify-content:center;font-size:16px;padding:16px"><i class="ti ti-x" style="color:var(--red)"></i> Nej</button>'
      +'</div>'
      +'<div class="avvik-field" id="avvik-field">'
      +'<label>Kommentar (obligatorisk vid Nej)</label>'
      +'<textarea id="avvik-text" placeholder="Beskriv åtgärd…"></textarea>'
      +'</div>';
  } else {
    body=forsenInfo+prevHtml
      +'<div class="form-field"><label>Värde</label>'
      +'<input type="'+(p.typ==='numerisk'?'number':'text')+'" id="fritext-val" placeholder="'+(p.instr||'Ange värde')+'" style="font-size:18px">'
      +'</div>';
  }

  if(p.instr)body+='<div style="font-size:12px;color:var(--text3);margin-top:4px"><i class="ti ti-info-circle" style="font-size:12px"></i> '+p.instr+'</div>';

  document.getElementById('mk-body').innerHTML=body;
  openModal('modal-kontroll');

  if(p.typ==='temp'){
    initDrums();
    onDrumChange();
  }
}

var _jaNejVal=null;
function setJaNej(val){
  _jaNejVal=val;

  document.getElementById('btn-ja').style.borderColor=val?'var(--green)':'';
  document.getElementById('btn-nej').style.background=!val?'var(--red-bg)':'';
  document.getElementById('btn-nej').style.borderColor=!val?'var(--red)':'';

}

async function saveKontroll(){
  var p=_program.find(function(x){return x.id===_currentPunktId;});
  if(!p)return;

  // Check if today's month is signed — if so, block saving
  var now = new Date();
  var monthKey = now.getFullYear()+'-'+(now.getMonth()<9?'0':'')+(now.getMonth()+1);
  if(_signaturer && _signaturer[monthKey]){
    var sign = _signaturer[monthKey];
    toast('Månaden är låst – signerad av '+sign.av+' '+sign.ts.slice(0,10),'warn');
    closeModal('modal-kontroll');
    return;
  }
  var varde,avvikelse='',ok=true;

  if(p.typ==='temp'){
    // Read value from single scale drum
    var val;
    if(_drumValues['temp-scale']!==undefined){
      val = parseFloat(_drumValues['temp-scale']);
    } else {
      var sign2=_drumValues['temp-sign']||'+';
      var whole2=parseInt(_drumValues['temp-whole']||0);
      var dec2=parseInt(_drumValues['temp-dec']||0);
      val=parseFloat(sign2+''+whole2+'.'+dec2);
    }
    varde=val;
    if(p.min!==undefined&&p.min!==''&&p.min!==null&&varde<parseFloat(p.min))ok=false;
    if(p.max!==undefined&&p.max!==''&&p.max!==null&&varde>parseFloat(p.max))ok=false;
    if(!ok){
      avvikelse=(document.getElementById('avvik-text')||{}).value||'';
      if(!avvikelse.trim()){toast('Ange åtgärd vid avvikelse','warn');return;}
    }
    varde=varde.toFixed(1);
  } else if(p.typ==='janej'){
    if(_jaNejVal===null){toast('Välj Ja eller Nej','warn');return;}
    varde=_jaNejVal?'Ja':'Nej';
    ok=_jaNejVal;
    if(!ok){
      avvikelse=(document.getElementById('avvik-text')||{}).value||'';
      if(!avvikelse.trim()){toast('Ange kommentar vid Nej','warn');return;}
    }
  } else {
    varde=(document.getElementById('fritext-val')||{}).value||'';
    if(!varde.trim()){toast('Ange ett värde','warn');return;}
  }

  // Sen = kontrollen var röd (missad från igår) och görs nu idag
  var isMissed = getPunktStatus(p) === 'red';
  var forsentMinutter = 0;
  if(isMissed){
    // Late since yesterday midnight
    var now4 = new Date();
    var startOfYesterday = new Date(now4);
    startOfYesterday.setDate(startOfYesterday.getDate()-1);
    startOfYesterday.setHours(23,59,0,0);
    forsentMinutter = Math.round((now4 - startOfYesterday) / 60000);
  }

  var entry={
    varde:String(varde),
    ts:new Date().toISOString(),
    av:_user.name,
    ok:ok,
    avvikelse:avvikelse,
    forSent:isMissed,
    forsentMinutter:forsentMinutter
  };

  _utfall[_currentPunktId]=entry;
  var today=todayStr();
  var ok2=await ghPut(KBASE+'/utfall/'+_anlaggningId+'/'+today+'.json',_utfall,'Kontroll: '+p.namn);
  closeModal('modal-kontroll');
  if(ok2){
    toast(isMissed?'Sparat – markerat som för sent':'Sparat','ok');
    renderDag();
  } else toast('Kunde ej spara','err');
}

var _rapportView='sammanfattning';
var _rapportYear=new Date().getFullYear();
var _rapportMonth=new Date().getMonth();
var _rapportAllUtfall={};

async function renderHist(){
  var el = document.getElementById('view-hist');
  el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text3)"><i class="ti ti-loader" style="font-size:32px"></i></div>';

  var now = new Date();
  var sm = document.getElementById('rp-sel-month');
  var sy = document.getElementById('rp-sel-year');
  if(sm) _rapportMonth = parseInt(sm.value);
  if(sy) _rapportYear  = parseInt(sy.value);

  var MONTHS = ['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
  var yearOpts = '', y0 = now.getFullYear();
  for(var y=y0-2;y<=y0+1;y++) yearOpts += '<option value="'+y+'"'+(y===_rapportYear?' selected':'')+'>'+y+'</option>';
  var monthOpts = MONTHS.map(function(m,i){ return '<option value="'+i+'"'+(i===_rapportMonth?' selected':'')+'>'+m+'</option>'; }).join('');

  var daysInMonth = new Date(_rapportYear, _rapportMonth+1, 0).getDate();
  var prefix = _rapportYear+'-'+(_rapportMonth<9?'0':'')+(_rapportMonth+1)+'-';
  var isCurrentMonth = _rapportYear===now.getFullYear() && _rapportMonth===now.getMonth();
  var today = isCurrentMonth ? now.getDate() : daysInMonth;

  // Load all days in selected month
  _rapportAllUtfall = {};
  for(var d=1;d<=daysInMonth;d++){
    var ds = prefix+(d<10?'0':'')+d;
    var r = await ghGet(KBASE+'/utfall/'+_anlaggningId+'/'+ds+'.json');
    if(r&&r.data) _rapportAllUtfall[ds] = r.data;
  }

  // KPI
  var totalDone=0,totalExp=0,totalAvvik=0,totalSena=0,totalMissed=0;
  _program.forEach(function(p){
    var exp = p.intervall==='dagligen'?today : p.intervall==='veckovis'?Math.ceil(today/7) : 1;
    totalExp += exp;
    var done=0;
    Object.keys(_rapportAllUtfall).forEach(function(ds){
      if(_rapportAllUtfall[ds][p.id]){
        done++; totalDone++;
        if(!_rapportAllUtfall[ds][p.id].ok) totalAvvik++;
        if(_rapportAllUtfall[ds][p.id].forSent) totalSena++;
      }
    });
    totalMissed += Math.max(0, exp-done);
  });
  var pctTot = Math.round(totalDone/Math.max(totalExp,1)*100);

  var headerHtml =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">'
    +'<div style="font-size:17px;font-weight:700">Kontrollrapport</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
    +'<select id="rp-sel-month" onchange="renderHist()" style="padding:7px 10px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-family:inherit">'+monthOpts+'</select>'
    +'<select id="rp-sel-year" onchange="renderHist()" style="padding:7px 10px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-family:inherit">'+yearOpts+'</select>'
    +'</div></div>'
    +'<div class="kpi-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(pctTot>=90?'var(--green)':pctTot>=70?'var(--amber)':'var(--red)')+'">'+pctTot+'%</div><div class="kpi-lbl">Utfört</div></div>'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(totalMissed>0?'var(--red)':'var(--green)')+'">'+totalMissed+'</div><div class="kpi-lbl">Missade</div></div>'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(totalAvvik>0?'var(--amber)':'var(--green)')+'">'+totalAvvik+'</div><div class="kpi-lbl">Avvikelser</div></div>'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(totalSena>0?'var(--amber)':'var(--green)')+'">'+totalSena+'</div><div class="kpi-lbl">Sena</div></div>'
    +'</div>'
  // Build chips with proper JS
  var chips = '<div class="rapport-chips">'
    +'<div class="rapport-chip'+(_rapportView==='sammanfattning'?' active':'')+'" data-rv="sammanfattning" onclick="setRapportView(this.dataset.rv)"><i class="ti ti-chart-bar" style="font-size:12px"></i> Sammanfattning</div>'
    +'<div class="rapport-chip'+(_rapportView==='matris'?' active':'')+'" data-rv="matris" onclick="setRapportView(this.dataset.rv)"><i class="ti ti-layout-grid" style="font-size:12px"></i> Kalendermatris</div>'
    +'</div>';

  headerHtml = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">'
    +'<div style="font-size:17px;font-weight:700">Kontrollrapport – '+_anlaggningNamn+'</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
    +'<select id="rp-sel-month" onchange="renderHist()" style="padding:7px 10px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-family:inherit">'+monthOpts+'</select>'
    +'<select id="rp-sel-year" onchange="renderHist()" style="padding:7px 10px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-family:inherit">'+yearOpts+'</select>'
    +'</div></div>'
    +'<div class="kpi-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(pctTot>=90?'var(--green)':pctTot>=70?'var(--amber)':'var(--red)')+'">'+pctTot+'%</div><div class="kpi-lbl">Utfört</div></div>'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(totalMissed>0?'var(--red)':'var(--green)')+'">'+totalMissed+'</div><div class="kpi-lbl">Missade</div></div>'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(totalAvvik>0?'var(--amber)':'var(--green)')+'">'+totalAvvik+'</div><div class="kpi-lbl">Avvikelser</div></div>'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(totalSena>0?'var(--amber)':'var(--green)')+'">'+totalSena+'</div><div class="kpi-lbl">Sena</div></div>'
    +'</div>'
    + chips;

  var contentHtml = '';

  if(_rapportView==='sammanfattning'){
    // Temp graph
    var tempPunkt = _program.find(function(p){return p.typ==='temp';});
    var graphHtml = '';
    if(tempPunkt){
      var allTemp = [];
      Object.keys(_rapportAllUtfall).sort().forEach(function(ds){
        if(_rapportAllUtfall[ds][tempPunkt.id]){
          allTemp.push({datum:ds, varde:parseFloat(_rapportAllUtfall[ds][tempPunkt.id].varde), ok:_rapportAllUtfall[ds][tempPunkt.id].ok});
        }
      });
      if(allTemp.length>1){
        var vals=allTemp.map(function(e){return e.varde;});
        var minV=Math.min.apply(null,vals)-2, maxV=Math.max.apply(null,vals)+2;
        if(tempPunkt.max) maxV=Math.max(maxV,parseFloat(tempPunkt.max)+1);
        if(tempPunkt.min) minV=Math.min(minV,parseFloat(tempPunkt.min)-1);
        var W=540, H=90;
        var pts=allTemp.map(function(e,i){
          var x=30+i*(W/(allTemp.length-1||1));
          var y=H-((e.varde-minV)/(maxV-minV))*(H-10)+5;
          return x+','+y;
        }).join(' ');
        var maxY=tempPunkt.max?H-((parseFloat(tempPunkt.max)-minV)/(maxV-minV))*(H-10)+5:null;
        var minY=tempPunkt.min?H-((parseFloat(tempPunkt.min)-minV)/(maxV-minV))*(H-10)+5:null;
        graphHtml='<div class="card" style="margin-bottom:12px;padding:12px 14px 4px">'
          +'<div style="font-size:12px;font-weight:600;margin-bottom:8px">'+tempPunkt.namn+' – temperaturlogg</div>'
          +'<svg viewBox="0 0 600 '+H+'" style="width:100%;height:80px;overflow:visible">'
          +(maxY?'<line x1="0" y1="'+maxY+'" x2="600" y2="'+maxY+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4,3"/>':'')
          +(minY?'<line x1="0" y1="'+minY+'" x2="600" y2="'+minY+'" stroke="var(--blue)" stroke-width="1" stroke-dasharray="4,3"/>':'')
          +'<polyline points="'+pts+'" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>'
          +allTemp.map(function(e,i){
            var x=30+i*(W/(allTemp.length-1||1));
            var y=H-((e.varde-minV)/(maxV-minV))*(H-10)+5;
            var col=e.ok?'var(--blue)':'var(--red)';
            return'<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+col+'"/>';
          }).join('')
          +'</svg>'
          +'<div style="display:flex;gap:12px;font-size:10px;color:var(--text3);margin-top:2px">'
          +(maxY?'<span style="display:flex;align-items:center;gap:3px"><span style="width:10px;height:1px;background:var(--red);display:inline-block"></span> Max '+tempPunkt.max+'°C</span>':'')
          +(minY?'<span style="display:flex;align-items:center;gap:3px"><span style="width:10px;height:1px;background:var(--blue);display:inline-block"></span> Min '+tempPunkt.min+'°C</span>':'')
          +'<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;background:var(--red);border-radius:50%;display:inline-block"></span> Avvikelse</span>'
          +'</div></div>';
      }
    }

    var rows = _program.map(function(p){
      var exp = p.intervall==='dagligen'?today : p.intervall==='veckovis'?Math.ceil(today/7) : 1;
      var done=0,late=0,avvik=0;
      Object.keys(_rapportAllUtfall).forEach(function(ds){
        if(_rapportAllUtfall[ds][p.id]){
          done++;
          if(_rapportAllUtfall[ds][p.id].forSent) late++;
          if(!_rapportAllUtfall[ds][p.id].ok) avvik++;
        }
      });
      var pct = Math.min(100,Math.round(done/Math.max(exp,1)*100));
      return'<div class="manad-row">'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.namn+'</div>'
        +'<div style="font-size:11px;color:var(--text3)">'+done+'/'+exp+' utförda'
        +(late?' · <span style="color:var(--amber)">'+late+' sena</span>':'')
        +(avvik?' · <span style="color:var(--red)">'+avvik+' avvik.</span>':'')+'</div>'
        +'</div>'
        +'<div class="prog-bar"><div class="prog-fill'+(pct<70?' danger':pct<90?' warn':'')+'" style="width:'+pct+'%"></div></div>'
        +'<div style="font-size:12px;font-weight:600;min-width:36px;text-align:right;color:'+(pct>=90?'var(--green)':pct>=70?'var(--amber)':'var(--red)')+'">'+pct+'%</div>'
        +'</div>';
    }).join('');
    contentHtml = graphHtml + '<div class="card" style="margin-bottom:14px">'+(rows||'<div style="padding:16px;text-align:center;color:var(--text3)">Ingen data för vald period</div>')+'</div>';

  } else {
    // KALENDERMATRIS
    var GROUPS=[{id:'varje_anvandning',label:'Varje användning'},{id:'dagligen',label:'Dagligen'},
      {id:'veckovis',label:'Veckovis'},{id:'manadsvis',label:'Månadsvis'},{id:'vid_behov',label:'Vid behov'}];

    var dayHeaders='<th class="name-col">Kontrollpunkt</th>';
    for(var d=1;d<=daysInMonth;d++){
      var date=new Date(_rapportYear,_rapportMonth,d);
      var dow=date.getDay();
      var isToday=isCurrentMonth&&d===now.getDate();
      var isWeekend=dow===0||dow===6;
      dayHeaders+='<th style="min-width:22px;font-size:9px'+(isWeekend?';color:var(--red)':'')+(isToday?';color:var(--green);font-weight:700':'')+'">'+(d<10?'0':'')+d+'</th>';
    }

    var matrixRows='';
    GROUPS.forEach(function(grp){
      var punkter=_program.filter(function(p){return p.intervall===grp.id;});
      if(!punkter.length) return;
      matrixRows+='<tr class="matrix-group-row"><th colspan="'+(daysInMonth+1)+'">'+grp.label+'</th></tr>';
      punkter.forEach(function(p){
        var cells='';
        for(var d=1;d<=daysInMonth;d++){
          var ds=prefix+(d<10?'0':'')+d;
          var entry=_rapportAllUtfall[ds]&&_rapportAllUtfall[ds][p.id];
          var date2=new Date(_rapportYear,_rapportMonth,d);
          var dow2=date2.getDay();
          var expected=false;
          if(p.intervall==='dagligen') expected=true;
          else if(p.intervall==='veckovis'){ var dl=p.deadline||{}; expected=(dow2===parseInt(dl.dag||0)); }
          else if(p.intervall==='manadsvis') expected=(d===1);
          var cls='mc-none';
          if(entry){
            if(!entry.ok) cls='mc-avvik';
            else if(entry.forSent) cls='mc-late';
            else cls='mc-ok';
          } else if(expected&&d<=(isCurrentMonth?now.getDate():daysInMonth)){
            cls='mc-miss';
          } else if(!expected){
            cls='mc-gray';
          }
          var safeDs=ds.replace(/"/g,'');
          var safePid=p.id.replace(/"/g,'');
          cells+='<td><div class="matrix-cell '+cls+'"'
            +(cls!=='mc-none'&&cls!=='mc-gray'?' data-ds="'+safeDs+'" data-pid="'+safePid+'" onclick="openCellDetail(this.dataset.ds,this.dataset.pid,this.dataset.pid)"':'')
            +'></div></td>';
        }
        matrixRows+='<tr><td class="name-col" title="'+p.namn+'">'+p.namn+'</td>'+cells+'</tr>';
      });
    });

    contentHtml='<div class="matrix-wrap"><table class="matrix-table" style="background:var(--bg2);border-radius:var(--radius);overflow:hidden;width:100%">'
      +'<thead><tr>'+dayHeaders+'</tr></thead>'
      +'<tbody>'+matrixRows+'</tbody>'
      +'</table></div>'
      +'<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text2);margin-bottom:14px">'
      +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:14px;border-radius:3px;background:var(--green);display:inline-block"></span> Utförd</span>'
      +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:14px;border-radius:3px;background:var(--amber);display:inline-block"></span> Sen</span>'
      +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:14px;border-radius:3px;background:var(--red);display:inline-block"></span> Avvikelse</span>'
      +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:14px;border-radius:3px;background:rgba(163,45,45,.15);display:inline-block"></span> Missad</span>'
      +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:14px;border-radius:3px;background:var(--bg4);display:inline-block"></span> Ej aktuell</span>'
      +'</div>';
  }

  el.innerHTML = headerHtml + contentHtml;
}

function setRapportView(v){
  _rapportView=v;
  var sm=document.getElementById('rp-sel-month');
  var sy=document.getElementById('rp-sel-year');
  if(sm) _rapportMonth=parseInt(sm.value);
  if(sy) _rapportYear=parseInt(sy.value);
  renderHist();
}

function openCellDetail(ds, punktId){
  var p = _program.find(function(x){return x.id===punktId;});
  var entry = _rapportAllUtfall[ds] && _rapportAllUtfall[ds][punktId];
  document.getElementById('cell-title').textContent = p ? p.namn : punktId;
  document.getElementById('cell-sub').textContent = ds;
  var body = '';
  if(entry){
    var col = !entry.ok?'var(--red)':entry.forSent?'var(--amber)':'var(--green)';
    var status = !entry.ok?'Avvikelse':entry.forSent?'Sen (+'+entry.forsentMinutter+' min)':'OK';
    body = '<div style="background:var(--bg3);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px">'
      +'<div style="font-size:26px;font-weight:700;color:'+col+'">'+entry.varde+(p&&p.typ==='temp'?' °C':'')+'</div>'
      +'<div style="font-size:13px;color:'+col+';margin-top:4px"><i class="ti ti-'+(entry.ok?'check':'x')+'" style="font-size:12px"></i> '+status+'</div>'
      +'</div>'
      +'<div style="font-size:13px;color:var(--text2);margin-bottom:6px"><i class="ti ti-user" style="font-size:12px"></i> '+entry.av+'</div>'
      +'<div style="font-size:13px;color:var(--text2);margin-bottom:6px"><i class="ti ti-clock" style="font-size:12px"></i> '+entry.ts.slice(11,16)+'</div>'
      +(entry.avvikelse?'<div style="background:var(--red-bg);border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--red);margin-top:8px"><i class="ti ti-alert-triangle" style="font-size:12px"></i> '+entry.avvikelse+'</div>':'');
  } else {
    body = '<div style="text-align:center;padding:24px;color:var(--text3)">'
      +'<i class="ti ti-x" style="font-size:36px;display:block;margin-bottom:8px;color:var(--red)"></i>'
      +'<div style="font-size:14px;font-weight:500;color:var(--red);margin-bottom:4px">Missad kontroll</div>'
      +'<div style="font-size:12px">Ingen registrering för detta datum.</div>'
      +'</div>';
  }
  document.getElementById('cell-body').innerHTML = body;
  openModal('modal-cell');
}


async function renderManad(){
  var el=document.getElementById('view-manad');
  el.innerHTML='<div style="text-align:center;padding:30px;color:var(--text3)"><i class="ti ti-loader" style="font-size:32px"></i></div>';
  var now=new Date();
  var year=now.getFullYear(),month=now.getMonth();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var prefix=year+'-'+(month<9?'0':'')+(month+1)+'-';
  var allUtfall={};
  for(var d=1;d<=daysInMonth;d++){
    var ds=prefix+(d<10?'0':'')+d;
    var r=await ghGet(KBASE+'/utfall/'+_anlaggningId+'/'+ds+'.json');
    if(r&&r.data)allUtfall[ds]=r.data;
  }
  var monthKey=year+'-'+(month<9?'0':'')+(month+1);
  var sign=_signaturer[monthKey];
  var today=now.getDate();
  var rows=_program.map(function(p){
    var expected=p.intervall==='dagligen'?today:p.intervall==='veckovis'?Math.ceil(today/7):1;
    var done=0,late=0,avvik=0;
    Object.keys(allUtfall).forEach(function(ds){
      if(allUtfall[ds][p.id]){done++;if(allUtfall[ds][p.id].forSent)late++;if(!allUtfall[ds][p.id].ok)avvik++;}
    });
    var pct=Math.min(100,Math.round(done/Math.max(expected,1)*100));
    return'<div class="manad-row">'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.namn+'</div>'
      +'<div style="font-size:11px;color:var(--text3)">'+done+'/'+expected+' utförda'+(late?' · <span style="color:var(--amber)">'+late+' sena</span>':'')+(avvik?' · <span style="color:var(--red)">'+avvik+' avvik.</span>':'')+'</div>'
      +'</div>'
      +'<div class="prog-bar"><div class="prog-fill'+(pct<70?' danger':pct<90?' warn':'')+'" style="width:'+pct+'%"></div></div>'
      +'<div style="font-size:12px;font-weight:600;min-width:36px;text-align:right;color:'+(pct>=90?'var(--green)':pct>=70?'var(--amber)':'var(--red)')+'">'+pct+'%</div>'
      +'</div>';
  }).join('');
  var totalDone=0,totalExp=0,totalAvvik=0;
  _program.forEach(function(p){
    var exp=p.intervall==='dagligen'?today:p.intervall==='veckovis'?Math.ceil(today/7):1;
    totalExp+=exp;
    Object.keys(allUtfall).forEach(function(ds){
      if(allUtfall[ds][p.id]){totalDone++;if(!allUtfall[ds][p.id].ok)totalAvvik++;}
    });
  });
  var MONTHS=['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
  el.innerHTML='<div style="font-size:17px;font-weight:700;margin-bottom:12px">'+MONTHS[month]+' '+year+' – '+_anlaggningNamn+'</div>'
    +'<div class="kpi-row">'
    +'<div class="kpi"><div class="kpi-val" style="color:var(--green)">'+Math.round(totalDone/Math.max(totalExp,1)*100)+'%</div><div class="kpi-lbl">Utfört</div></div>'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(totalAvvik>0?'var(--red)':'var(--green)')+'">'+totalAvvik+'</div><div class="kpi-lbl">Avvikelser</div></div>'
    +'<div class="kpi"><div class="kpi-val" style="color:'+(sign?'var(--green)':'var(--text3)')+'"><i class="ti ti-'+(sign?'check':'clock')+'" style="font-size:20px"></i></div><div class="kpi-lbl">'+(sign?'Signerat':'Ej signerat')+'</div></div>'
    +'</div>'
    +'<div class="card" style="margin-bottom:14px">'+rows+'</div>'
    +(sign
      ?'<div class="sign-box"><div style="font-size:13px;font-weight:600;color:var(--blue);margin-bottom:4px"><i class="ti ti-writing-sign"></i> Signerad</div><div style="font-size:13px">'+sign.av+' · '+sign.ts.slice(0,10)+' '+sign.ts.slice(11,16)+'</div></div>'
      :'<div class="sign-box"><div style="font-size:13px;font-weight:500;color:var(--blue);margin-bottom:8px">Signera '+MONTHS[month]+' '+year+'</div>'
        +'<div style="font-size:12px;color:var(--text2);margin-bottom:12px">Granska alla kontroller ovan och signera om perioden är komplett och korrekt.</div>'
        +'<button class="btn btn-primary btn-full" onclick="openSignering()"><i class="ti ti-writing-sign"></i> Granska och signera</button></div>');
}

function openSignering(){
  var now=new Date();
  var month=now.getMonth();
  var monthName=['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'][month];
  document.getElementById('sign-title').textContent='Signera '+monthName+' '+now.getFullYear();
  document.getElementById('sign-sub').textContent=_anlaggningNamn;
  document.getElementById('sign-body').innerHTML=
    '<div style="font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:16px">'
    +'Jag bekräftar att dokumentationen för <strong>'+monthName+' '+now.getFullYear()+'</strong> är korrekt, komplett och att eventuella avvikelser är åtgärdade och dokumenterade.</div>'
    +'<div style="background:var(--bg3);border-radius:var(--radius);padding:12px 14px;margin-bottom:4px">'
    +'<div style="font-size:12px;color:var(--text3)">Signerar som</div>'
    +'<div style="font-size:15px;font-weight:500;margin-top:2px">'+_user.name+'</div>'
    +'<div style="font-size:12px;color:var(--text3);margin-top:2px">'+new Date().toLocaleString('sv-SE')+'</div>'
    +'</div>';
  openModal('modal-sign');
}

async function doSignera(){
  var now=new Date();
  var monthKey=now.getFullYear()+'-'+(now.getMonth()<9?'0':'')+(now.getMonth()+1);
  _signaturer[monthKey]={av:_user.name,ts:now.toISOString(),anlaggning:_anlaggningId};
  var ok=await ghPut(KBASE+'/signaturer/'+_anlaggningId+'.json',_signaturer,'Signering '+monthKey);
  closeModal('modal-sign');
  if(ok){toast('Månad signerad','ok');renderManad();}
  else toast('Kunde ej signera','err');
}

// ── ADMIN ─────────────────────────────────────────────────────────────────
var _adminTab = 'program';

function renderAdmin(){
  var chipHtml='<div class="chips">'
    +'<div class="chip'+(_adminTab==='program'?' active':'')+'" data-at="program" onclick="setAdminTab(this.dataset.at)"><i class="ti ti-clipboard-check" style="font-size:12px"></i> Kontrollpunkter</div>'
    +(_isAdmin?'<div class="chip'+(_adminTab==='anlaggningar'?' active':'')+'" data-at="anlaggningar" onclick="setAdminTab(this.dataset.at)"><i class="ti ti-building" style="font-size:12px"></i> Anläggningar</div>':'')
    +(_isAdmin?'<div class="chip'+(_adminTab==='leverantorer'?' active':'')+'" data-at="leverantorer" onclick="setAdminTab(this.dataset.at)"><i class="ti ti-truck" style="font-size:12px"></i> Leverantörer</div>':'')
    +'</div>';

  var contentHtml='';
  if(_adminTab==='program'){
    var GROUPS=[
      {id:'varje_anvandning',label:'Varje användning',icon:'ti-refresh'},
      {id:'dagligen',        label:'Dagligen',         icon:'ti-sun'},
      {id:'veckovis',        label:'Veckovis',         icon:'ti-calendar-week'},
      {id:'manadsvis',       label:'Månadsvis',        icon:'ti-calendar-month'},
      {id:'vid_behov',       label:'Vid behov',        icon:'ti-dots'},
    ];
    var typeIcon={temp:'ti-thermometer',janej:'ti-check',fritext:'ti-text-size',numerisk:'ti-123'};
    var typeClass={temp:'type-temp',janej:'type-janej',fritext:'type-text',numerisk:'type-text'};

    var groupsHtml=GROUPS.map(function(grp){
      var punkter=_program.filter(function(p){return p.intervall===grp.id;});
      if(!punkter.length) return '';

      // Deadline summary text
      function dlSummary(p){
        var dl=p.deadline||{};
        if(grp.id==='dagligen') return 'Senast '+(dl.tid||'23:59');
        if(grp.id==='veckovis'){
          var dagar=['Sön','Mån','Tis','Ons','Tor','Fre','Lör'];
          return 'Senast '+dagar[parseInt(dl.dag||'0')]+' '+(dl.tid||'22:00');
        }
        if(grp.id==='manadsvis'){
          if(dl.typ==='sista_sun') return 'Sista söndagen '+(dl.tid||'23:00');
          return 'Senast den '+(dl.dag||'30')+':e '+(dl.tid||'23:00');
        }
        return '';
      }

      var items=punkter.map(function(p){
        var tIcon=typeIcon[p.typ]||'ti-check';
        var tClass=typeClass[p.typ]||'type-janej';
        var dl=dlSummary(p);
        return'<div class="prog-item">'
          +'<div class="type-icon '+tClass+'"><i class="ti '+tIcon+'"></i></div>'
          +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:14px;font-weight:500">'+p.namn+'</div>'
          +'<div style="font-size:11px;color:var(--text3)">'+p.kategori
          +(p.max?' · max '+p.max+'°C':'')+(p.min?' · min '+p.min+'°C':'')
          +(dl?' · <span style="color:var(--blue)"><i class="ti ti-clock" style="font-size:10px"></i> '+dl+'</span>':'')
          +'</div>'
          +'</div>'
          +'<div style="display:flex;gap:6px">'
          +'<button class="btn" style="padding:6px 10px;font-size:12px" data-id="'+p.id+'" onclick="editPunkt(this.dataset.id)"><i class="ti ti-pencil"></i> Redigera</button>'
          +'<button class="btn btn-danger" style="padding:6px 10px;font-size:12px" data-id="'+p.id+'" onclick="deletePunkt(this.dataset.id)"><i class="ti ti-trash"></i> Ta bort</button>'
          +'</div>'
          +'</div>';
      }).join('');

      return'<div style="margin-bottom:12px">'
        +'<div style="display:flex;align-items:center;gap:7px;padding:6px 4px;margin-bottom:4px">'
        +'<i class="ti '+grp.icon+'" style="font-size:14px;color:var(--text2)"></i>'
        +'<span style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em">'+grp.label+'</span>'
        +'<span style="font-size:11px;color:var(--text3);margin-left:auto">'+punkter.length+' punkt'+(punkter.length===1?'':'er')+'</span>'
        +'</div>'
        +'<div class="card">'+items+'</div>'
        +'</div>';
    }).join('');

    contentHtml='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
      +'<div style="font-size:14px;font-weight:500">'+_anlaggningNamn+'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
      +'<button class="btn btn-sm" onclick="exportPunkterExcel()"><i class="ti ti-download"></i> Exportera Excel</button>'
      +'<label class="btn btn-sm" style="cursor:pointer"><i class="ti ti-upload"></i> Importera Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importPunkterExcel(this)"></label>'
      +'<button class="btn btn-primary" onclick="newPunkt()"><i class="ti ti-plus"></i> Ny punkt</button>'
      +'</div>'
      +'</div>'
      +(groupsHtml||'<div style="padding:24px;text-align:center;color:var(--text3)">Inga kontrollpunkter ännu.</div>');
  }

async function loadAnlaggningar(){
  var r=await ghGet(KBASE+'/settings/anlaggningar.json');
  _anlaggningar=(r&&r.data&&r.data.anlaggningar)||[];
}

function newAnlaggning(){
  var namn=prompt('Anläggningsnamn (t.ex. Östnora Restaurang):');
  if(!namn)return;
  var id=namn.toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_');
  id=prompt('Anläggnings-ID (används som mappnamn):',id);
  if(!id)return;
  _anlaggningar.push({id:id.trim(),namn:namn.trim()});
  saveAnlaggningar();
}

function editAnlaggning(id){
  var a=_anlaggningar.find(function(x){return x.id===id;});
  if(!a)return;
  var namn=prompt('Nytt namn:',a.namn);
  if(!namn)return;
  a.namn=namn.trim();
  saveAnlaggningar();
}

function deleteAnlaggning(id){
  var a=_anlaggningar.find(function(x){return x.id===id;});
  if(!confirm('Ta bort "'+( a?a.namn:id)+'"?'))return;
  _anlaggningar=_anlaggningar.filter(function(x){return x.id!==id;});
  saveAnlaggningar();
}

async function saveAnlaggningar(){
  var ok=await ghPut(KBASE+'/settings/anlaggningar.json',
    {anlaggningar:_anlaggningar},'Anläggningar uppdaterade');
  if(ok){toast('Sparat','ok');renderAdmin();}
  else toast('Kunde ej spara','err');
}

function newPunkt(){

  document.getElementById('mp-max').value='';
  document.getElementById('mp-ref').value='';
  document.getElementById('mp-instr').value='';

function editPunkt(id){
  var p=_program.find(function(x){return x.id===id;});
  if(!p)return;
  document.getElementById('mp-title').textContent='Redigera kontrollpunkt';
  document.getElementById('mp-namn').value=p.namn||'';
  document.getElementById('mp-kategori').value=p.kategori||'Temperatur';
  document.getElementById('mp-typ').value=p.typ||'temp';
  document.getElementById('mp-min').value=p.min||'';
  document.getElementById('mp-max').value=p.max||'';
  document.getElementById('mp-intervall').value=p.intervall||'dagligen';
  document.getElementById('mp-ref').value=p.referens||'';
  document.getElementById('mp-instr').value=p.instr||'';
  document.getElementById('mp-edit-id').value=id;
  // Load deadline
  var dl=p.deadline||{};
  if(p.intervall==='dagligen'){
    var el=document.getElementById('mp-dl-tid'); if(el)el.value=dl.tid||'23:59';
  } else if(p.intervall==='veckovis'){
    var eld=document.getElementById('mp-dl-dag'); if(eld)eld.value=dl.dag||'0';
    var elt=document.getElementById('mp-dl-vec-tid'); if(elt)elt.value=dl.tid||'22:00';
  } else if(p.intervall==='manadsvis'){
    var elmt=document.getElementById('mp-dl-manad-typ');
    if(elmt)elmt.value=dl.typ||'dag';
    if(dl.typ==='sista_sun'){
      var elst=document.getElementById('mp-dl-sun-tid'); if(elst)elst.value=dl.tid||'23:00';
    } else {
      var elmd=document.getElementById('mp-dl-manad-dag'); if(elmd)elmd.value=dl.dag||'30';
      var elmt2=document.getElementById('mp-dl-manad-tid'); if(elmt2)elmt2.value=dl.tid||'23:00';
    }
  }
  updateTypFields();
  updateDeadlineFields();
  openModal('modal-punkt');
}

function updateDeadlineFields(){
  var iv=document.getElementById('mp-intervall').value;
  document.getElementById('dl-dagligen').style.display = iv==='dagligen'?'':'none';
  document.getElementById('dl-veckovis').style.display = iv==='veckovis'?'':'none';
  document.getElementById('dl-manadsvis').style.display= iv==='manadsvis'?'':'none';
